<html lang="en">
<head>

<title>Neon Balls</title>
<style>
  /* Yorug' rejim */
  :root {
    --bg: #f3f1f7; --fg: #24132b; --muted: #7d7186; --card: #ffffff; --line: rgba(36,19,43,.1);
    --acc: #845591; --acc2: #c9a0dc; --ball: #24132b; --edge: rgba(132,85,145,.55); --edgeTop: rgba(132,85,145,.22);
    --pick: #845591; --danger: #d4466a; --shadow: 0 10px 28px rgba(60,30,80,.12); --chip: rgba(36,19,43,.06);
    --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px);
    color-scheme: light;
  }
  /* Qorong'i rejim */
  :root.dark {
    --bg: #0d0b12; --fg: #f3eef6; --muted: #9c90a6; --card: #1b1622; --line: rgba(255,255,255,.1);
    --acc: #c9a0dc; --acc2: #845591; --ball: #f3eef6; --edge: rgba(201,160,220,.6); --edgeTop: rgba(201,160,220,.25);
    --pick: #c9a0dc; --danger: #ff6b8b; --shadow: 0 10px 28px rgba(0,0,0,.5); --chip: rgba(255,255,255,.08);
    color-scheme: dark;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg); }
  body {
    color: var(--fg); font-family: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, "Segoe UI", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none;
  }
  [hidden] { display: none !important; }
  button { font-family: inherit; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  button:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  .icon-btn { width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); box-shadow: var(--shadow);
    display: grid; place-items: center; padding: 0; }
  .icon-btn svg { width: 22px; height: 22px; stroke: var(--fg); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .icon-btn:active { transform: scale(.94); }

  /* Bosh menyu */
  #menu { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    padding: calc(16px + var(--st)) max(20px, var(--sr)) calc(20px + var(--sb)) max(20px, var(--sl)); box-sizing: border-box; touch-action: manipulation; }
  #menuTop { position: absolute; top: calc(12px + var(--st)); right: max(14px, var(--sr)); display: flex; gap: 10px; }
  .logo { text-align: center; }
  .logo .balls { display: flex; justify-content: center; gap: 8px; margin-bottom: 14px; }
  .logo .balls i { width: 16px; height: 16px; border-radius: 50%; background: var(--acc); animation: bob 1.4s ease-in-out infinite; }
  .logo .balls i:nth-child(2) { background: #5e2a62; animation-delay: .15s; }
  .logo .balls i:nth-child(3) { background: #c9a0dc; animation-delay: .3s; }
  @keyframes bob { 50% { transform: translateY(-10px); } }
  .logo h1 { margin: 0; font-size: 46px; line-height: .95; font-weight: 900; letter-spacing: .02em; }
  .logo h1 span { display: block; color: var(--acc); }
  .bestChip { background: var(--chip); border-radius: 999px; padding: 8px 16px; font-weight: 800; font-size: 15px; }
  .bestChip b { color: var(--acc); }
  .menuBtns { display: flex; flex-direction: column; gap: 12px; width: min(300px, 100%); }
  .big { border: 0; border-radius: 18px; padding: 18px; font-size: 20px; font-weight: 900; letter-spacing: .03em; color: #fff;
    background: linear-gradient(135deg, #845591, #5e2a62); box-shadow: 0 10px 24px rgba(94,42,98,.3); }
  .big:active { transform: scale(.97); }
  .soft { border: 1px solid var(--line); border-radius: 18px; padding: 15px; font-size: 17px; font-weight: 800; background: var(--card); box-shadow: var(--shadow); }
  .soft:active { transform: scale(.97); }

  /* O'yin paneli */
  #hud { position: fixed; left: 0; right: 0; top: 0; z-index: 5; padding: calc(10px + var(--st)) max(14px, var(--sr)) 0 max(14px, var(--sl));
    display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; pointer-events: none; }
  #hud > * { pointer-events: auto; }
  .scores { text-align: center; line-height: 1.05; }
  .scores .rec { font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  .scores .rec b { color: var(--acc); font-size: 14px; }
  .scores .cur { font-size: 34px; font-weight: 900; font-variant-numeric: tabular-nums; }
  #fastBtn { position: fixed; right: max(14px, var(--sr)); bottom: calc(12px + var(--sb)); z-index: 5; height: 52px; padding: 0 16px; gap: 6px;
    display: flex; align-items: center; border-radius: 16px; border: 1px solid var(--line); background: var(--card); box-shadow: var(--shadow); touch-action: none; }
  #fastBtn svg { width: 22px; height: 22px; stroke: var(--fg); fill: none; stroke-width: 2.2; stroke-linejoin: round; }
  #fastBtn b { font-size: 17px; font-weight: 900; }
  #fastBtn.on { background: var(--acc); border-color: var(--acc); } #fastBtn.on svg { stroke: #fff; } #fastBtn.on b { color: #fff; }

  /* Modallar */
  .modal { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: rgba(20,10,25,.4);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); touch-action: manipulation;
    padding: calc(16px + var(--st)) max(18px, var(--sr)) calc(16px + var(--sb)) max(18px, var(--sl)); box-sizing: border-box; animation: fade .18s ease-out; }
  @keyframes fade { from { opacity: 0; } }
  .sheet { width: min(360px, 100%); background: var(--card); border-radius: 26px; padding: 22px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px;
    animation: pop .22s cubic-bezier(.2,1.4,.4,1); max-height: 100%; overflow: auto; box-sizing: border-box; touch-action: pan-y; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
  @keyframes pop { from { transform: scale(.92); opacity: 0; } }
  .sheet h2 { margin: 0 0 4px; text-align: center; font-size: 26px; font-weight: 900; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 17px; }
  .switch { width: 52px; height: 32px; border-radius: 99px; border: 0; background: var(--chip); position: relative; flex: none; transition: background .2s; padding: 0; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.25); transition: transform .2s; }
  .switch.on { background: var(--acc); } .switch.on::after { transform: translateX(20px); }
  input[type=range] { width: 130px; accent-color: var(--acc); }
  .langs { display: flex; gap: 6px; }
  .langs button { border: 1px solid var(--line); background: var(--chip); border-radius: 10px; padding: 7px 10px; font-weight: 800; font-size: 14px; }
  .langs button.on { background: var(--acc); color: #fff; border-color: var(--acc); }
  .result { text-align: center; }
  .result .n { font-size: 64px; font-weight: 900; line-height: 1; color: var(--acc); }
  .result .l { color: var(--muted); font-weight: 800; letter-spacing: .1em; font-size: 12px; text-transform: uppercase; }
  .newrec { text-align: center; font-weight: 900; color: var(--acc); font-size: 18px; }
  .slide { text-align: center; }
  .slide svg { width: 100%; max-width: 260px; height: auto; border-radius: 18px; background: var(--bg); border: 1px solid var(--line); }
  .slide h3 { margin: 12px 0 4px; font-size: 20px; }
  .slide p { margin: 0; color: var(--muted); line-height: 1.45; font-size: 15px; }
  .dots { display: flex; justify-content: center; gap: 7px; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--chip); }
  .dots i.on { background: var(--acc); width: 22px; border-radius: 99px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .bitem { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; padding: 9px 2px; border-bottom: 1px solid var(--line); }
  .bitem svg { width: 52px; height: 52px; }
  .bitem b { display: block; font-size: 16px; } .bitem span { color: var(--muted); font-size: 13.5px; line-height: 1.35; }
  .bitem i { font-style: normal; font-size: 12px; font-weight: 800; color: var(--muted); white-space: nowrap; }
  .bitem i.ok { color: #2e9e5b; }
  .bhead { margin: 10px 0 2px; font-weight: 900; font-size: 15px; } .bsub { color: var(--muted); font-size: 13.5px; line-height: 1.4; margin-bottom: 4px; }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 40; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" hidden>

    <div class="rec"><span data-i18n="best">Best</span> <b id="recOut">0</b></div>

<button id="fastBtn" type="button" hidden data-i18n-aria="fast"><svg viewBox="0 0 24 24"><path d="M4 6l7 6-7 6zM13 6l7 6-7 6z"/></svg><b id="fastLbl">2x</b></button>

    </button>
    <button class="icon-btn" id="setBtn" type="button" data-i18n-aria="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
  <div class="logo"><div class="balls"><i></i><i></i><i></i></div><h1>NEON<span>BALLS</span></h1></div>

  <div class="menuBtns">

    <button class="big" id="startBtn" type="button">▶ <span data-i18n="play">PLAY</span></button>

</section>

<section id="pauseM" class="modal" hidden>
  <div class="sheet">
    <h2 data-i18n="paused">Paused</h2>
    <button class="big" id="resumeBtn" type="button">▶ <span data-i18n="resume">Resume</span></button>
    <button class="soft" id="restartBtn" type="button">↻ <span data-i18n="restart">Restart</span></button>
    <div class="two">
      <button class="soft" id="pSetBtn" type="button">⚙️ <span data-i18n="settings">Settings</span></button>

<section id="setM" class="modal" hidden>
  <div class="sheet">
    <h2 data-i18n="settings">Settings</h2>
    <div class="row"><span>🎵 <span data-i18n="music">Music</span></span><button class="switch" id="swMusic" type="button" data-i18n-aria="music"></button></div>
    <div class="row"><span>🔊 <span data-i18n="sfx">Sound effects</span></span><button class="switch" id="swSfx" type="button" data-i18n-aria="sfx"></button></div>
    <div class="row"><span>🎚 <span data-i18n="volume">Volume</span></span><input id="vol" type="range" min="0" max="1" step="0.05" data-i18n-aria="volume"></div>
    <div class="row"><span>🌙 <span data-i18n="dark">Dark mode</span></span><button class="switch" id="swDark" type="button" data-i18n-aria="dark"></button></div>
    <div class="row" style="border-bottom:0"><span>🌐 <span data-i18n="lang">Language</span></span>
      <div class="langs" id="langs"><button type="button" data-l="en">EN</button><button type="button" data-l="uz">UZ</button><button type="button" data-l="ru">RU</button></div>
    </div>
    <button class="big" id="setClose" type="button" data-i18n="done">Done</button>
  </div>
</section>

<section id="helpM" class="modal" hidden>
  <div class="sheet">
    <div id="slides"></div>
    <div class="dots" id="dots"></div>
    <div class="two">
      <button class="soft" id="prevSl" type="button">‹ <span data-i18n="back">Back</span></button>
      <button class="big" id="nextSl" type="button"></button>
    </div>
  </div>
</section>

<section id="bonusM" class="modal" hidden>
  <div class="sheet">
    <h2>🎁 <span data-i18n="bonuses">Bonuses</span></h2>
    <div id="bonusList"></div>
    <button class="big" id="bonusClose" type="button" data-i18n="done">Done</button>
  </div>
</section>

<section id="overM" class="modal" hidden>
  <div class="sheet">
    <h2 data-i18n="over">Game over</h2>
    <div class="result"><div class="n" id="finalScore">0</div><div class="l" data-i18n="score">Score</div></div>

    <div class="bestChip" style="text-align:center">🏆 <span data-i18n="best">Best</span>: <b id="overBest">0</b></div>

  </div>
</section>

<canvas id="confetti"></canvas>

      // bonus: qizil ikki halqa, ichida soni
      glow(cx, cy, 0.34 + breath * 0.14, 0.45);
      ring(cx, cy, 0.27, 0.045, '#b5172b'); ring(cx, cy, 0.2, 0.03, '#ff8a99');
      ctx.fillStyle = '#e6283c'; ctx.beginPath(); ctx.arc(cx, cy, 0.15, 0, Math.PI * 2); ctx.fill();
      textAt('+' + p.v, cx, cy, p.v >= 100 ? 0.11 : 0.14, '#ffffff');
    } else {
      // MAX WIN: uch halqa va aylanuvchi nurlar
      glow(cx, cy, 0.5 + breath * 0.18, 0.5);
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(p.t * 0.8); ctx.fillStyle = 'rgba(230,40,60,.35)';
      for (let k = 0; k < 12; k++) { ctx.rotate(Math.PI / 6); ctx.beginPath(); ctx.moveTo(-0.03, 0); ctx.lineTo(0, -0.5); ctx.lineTo(0.03, 0); ctx.fill(); }
      ctx.restore();
      ring(cx, cy, 0.31, 0.04, '#b5172b'); ring(cx, cy, 0.25, 0.032, '#e6283c'); ring(cx, cy, 0.2, 0.025, '#ff8a99');
      ctx.fillStyle = '#e6283c'; ctx.beginPath(); ctx.arc(cx, cy, 0.16, 0, Math.PI * 2); ctx.fill();
      textAt('+500', cx, cy - 0.025, 0.1, '#ffffff'); textAt('MAX', cx, cy + 0.07, 0.06, '#ffd6dc');
    }
  }
  function draw(dt) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, innerWidth, innerHeight);
    if (!G) return;
    // tepa va past chegara chiziqlari (butun ekran eni bo'ylab)
    const topY = oy + TOP * unit, floorY = oy + FLOOR * unit;
    ctx.fillStyle = C.edgeTop; ctx.fillRect(0, topY - 1, innerWidth, 2);
    const danger = G.bricks.some(b => b.r === ROWS - 1);
    ctx.fillStyle = danger ? C.danger : C.edge; ctx.fillRect(0, floorY - 1.5, innerWidth, 3);

    ctx.translate(ox, oy); ctx.scale(unit, unit);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    // g'ishtlar: tekis, bir rangli, to'g'ri burchakli
    for (const b of G.bricks) {
      b.scale += (1 - b.scale) * Math.min(1, dt * 14);
      const w = (1 - GX) * b.scale, h = (CH - GY) * b.scale, cx = b.c + 0.5, cy = (b.r + 0.5) * CH;
      ctx.fillStyle = colorFor(b.hp);
      ctx.fillRect(cx - w / 2, cy - h / 2, w, h);
      if (S.dark && b.hp >= 50000) { ctx.strokeStyle = 'rgba(201,160,220,.45)'; ctx.lineWidth = 0.02; ctx.strokeRect(cx - w / 2 + 0.01, cy - h / 2 + 0.01, w - 0.02, h - 0.02); }
      const s = String(b.hp);
      textAt(s, cx, cy, (s.length > 5 ? 0.2 : s.length > 3 ? 0.24 : 0.3) * b.scale, lightBrick(b.hp) ? '#3a1f45' : '#ffffff');
    }
    // +1 va bonus sharlar
    for (const p of G.picks) {
      p.t += dt;
      ctx.globalAlpha = p.got ? Math.max(0, 1 - (p.fade || 0) / 0.3) : 1;
      drawPick(p, p.c + 0.5, (p.r + 0.5) * CH);
      ctx.globalAlpha = 1;
    }
    // mo'ljal
    if (G.state === 'aim' && aim && aim.dir) {
      const l = launchPos(), d = aim.dir, hit = rayCast(l.x, l.y, d.x, d.y), tt = Math.min(hit.t, 16);
      ctx.fillStyle = C.ball; ctx.globalAlpha = 0.55;
      for (let s = 0.3; s < tt; s += 0.3) { ctx.beginPath(); ctx.arc(l.x + d.x * s, l.y + d.y * s, 0.04, 0, Math.PI * 2); ctx.fill(); }
      const hx = l.x + d.x * tt, hy = l.y + d.y * tt;
      ctx.globalAlpha = 0.8; ctx.strokeStyle = C.ball; ctx.lineWidth = 0.03;
      ctx.beginPath(); ctx.arc(hx, hy, R, 0, Math.PI * 2); ctx.stroke();
      let rx = d.x, ry = d.y; if (hit.nx) rx = -rx; if (hit.ny) ry = -ry;
      ctx.globalAlpha = 0.28;
      for (let s = 0.3; s < 1.2; s += 0.3) { ctx.beginPath(); ctx.arc(hx + rx * s, hy + ry * s, 0.032, 0, Math.PI * 2); ctx.fill(); }
      ctx.globalAlpha = 1;
    }
    // to'plar
    ctx.fillStyle = C.ball;
    if (G.state === 'aim' || G.fired < G.balls) { const l = launchPos(); ctx.beginPath(); ctx.arc(l.x, l.y, R, 0, Math.PI * 2); ctx.fill(); }
    for (const b of G.flying) { ctx.beginPath(); ctx.arc(b.x, b.y, R, 0, Math.PI * 2); ctx.fill(); }
    const rest = G.state === 'aim' ? G.balls : G.balls - G.fired;
    ctx.textAlign = 'center';
    if (rest > 0) textAt(`×${rest}`, clamp(G.launchX, 0.3, COLS - 0.3), FLOOR + 0.2, 0.22, C.fg);
    if (G.auto > 0) { G.auto -= dt; ctx.globalAlpha = Math.min(1, G.auto); textAt('+1', clamp(G.launchX, 0.3, COLS - 0.3) - 0.5, FLOOR - 0.35 - (1.6 - G.auto) * 0.3, 0.24, '#e6283c'); ctx.globalAlpha = 1; }
    if (G.pending > 0 && G.state === 'fire') textAt(`+${G.pending}`, clamp((G.firstLand ?? G.launchX) + 0.55, 0.3, COLS - 0.3), FLOOR + 0.2, 0.22, C.pick);
    for (const p of parts) { ctx.globalAlpha = 1 - p.life / p.max; ctx.fillStyle = p.color; ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); }
    ctx.globalAlpha = 1;
  }

  // =================== Ekranlar ===================
  let screen = 'menu';
  function show(name) {
    screen = name;
    $('menu').hidden = name !== 'menu';
    const inGame = name === 'game' || name === 'pause' || name === 'over';
    $('hud').hidden = !inGame;
    $('pauseM').hidden = name !== 'pause';
    $('overM').hidden = name !== 'over';
    if (name !== 'game') { aim = null; fastOff(); }
    if (name === 'menu') { $('menuBest').textContent = best; $('continueBtn').hidden = !store.get('save2', null); }
  }
  const openModal = id => { $(id).hidden = false; };
  const closeModal = id => { $(id).hidden = true; };
  function updateHUD() {
    $('scoreOut').textContent = G.score;
    $('recOut').textContent = Math.max(best, G.score);
    $('fastBtn').hidden = !(screen === 'game' && G.state === 'fire');
    $('fastLbl').textContent = fastMul() + 'x';
  }
  function startNew() { unlockAudio(); store.del('save2'); newGame(); show('game'); }
  function continueGame() { unlockAudio(); const s = store.get('save2', null); if (!s) return startNew(); restore(s); show('game'); }
  function pause() { if (screen !== 'game') return; if (G.state === 'aim') store.set('save2', snapshot()); show('pause'); }
  function gameOver() {
    G.over = true; store.del('save2');
    const sc = G.score, isRec = sc > best;
    if (isRec) { best = sc; store.set('best2', best); }
    $('finalScore').textContent = sc; $('overBest').textContent = best; $('newRec').hidden = !isRec;
    setTimeout(() => { show('over'); if (isRec) { sfx.record(); confetti(); } else sfx.over(); }, 450);
  }
  $('startBtn').onclick = startNew;
  $('continueBtn').onclick = continueGame;
  $('pauseBtn').onclick = pause;
  $('resumeBtn').onclick = () => show('game');
  $('restartBtn').onclick = startNew;
  $('pMenuBtn').onclick = () => show('menu');
  $('pSetBtn').onclick = () => openModal('setM');
  $('setBtn').onclick = () => { unlockAudio(); openModal('setM'); };
  $('setClose').onclick = () => closeModal('setM');
  $('againBtn').onclick = startNew;
  $('overMenuBtn').onclick = () => show('menu');
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

  // 2x: bosib turganda tezlashadi
  function fastOn(e) { e.preventDefault(); if (!G || G.state !== 'fire') return; G.fast = true; $('fastBtn').classList.add('on'); }
  function fastOff() { if (G) G.fast = false; $('fastBtn').classList.remove('on'); }
  $('fastBtn').addEventListener('touchstart', fastOn, { passive: false });
  $('fastBtn').addEventListener('touchend', fastOff);
  $('fastBtn').addEventListener('touchcancel', fastOff);
  $('fastBtn').addEventListener('mousedown', fastOn);
  addEventListener('mouseup', fastOff);
  $('fastBtn').addEventListener('contextmenu', e => e.preventDefault());

  // =================== Mo'ljal: teginish (iPhone uchun touch hodisalari) ===================
  function aimStart(id, x, y) {
    if (screen !== 'game' || !G || G.state !== 'aim') return;
    unlockAudio();
    aim = { id, dir: aimDir(toBoard(x, y), null) };
  }
  function aimMove(id, x, y) { if (aim && aim.id === id) aim.dir = aimDir(toBoard(x, y), aim.dir); }
  function aimEnd(id) {
    if (!aim || aim.id !== id) return;
    const d = aim.dir; aim = null;
    if (d && screen === 'game' && G.state === 'aim') fire(d);
  }
  cv.addEventListener('touchstart', e => { e.preventDefault(); const tc = e.changedTouches[0]; if (!aim) aimStart(tc.identifier, tc.clientX, tc.clientY); }, { passive: false });
  window.addEventListener('touchmove', e => {
    // oynalar ichida (masalan, bonuslar ro'yxati) surish mumkin bo'lsin
    if (!aim && e.target.closest && e.target.closest('.sheet')) return;
    e.preventDefault();
    for (const tc of e.changedTouches) aimMove(tc.identifier, tc.clientX, tc.clientY);
  }, { passive: false });
  window.addEventListener('touchend', e => { for (const tc of e.changedTouches) aimEnd(tc.identifier); });
  // iPhone teginishni bekor qilsa ham mo'ljal yo'qolmaydi: oxirgi yo'nalish bo'yicha otiladi
  window.addEventListener('touchcancel', e => { for (const tc of e.changedTouches) aimEnd(tc.identifier); });
  cv.addEventListener('mousedown', e => aimStart('m', e.clientX, e.clientY));
  window.addEventListener('mousemove', e => aimMove('m', e.clientX, e.clientY));
  window.addEventListener('mouseup', () => aimEnd('m'));
  document.addEventListener('gesturestart', e => e.preventDefault());

  // =================== Qo'llanma ===================
  const brk = (x, y, c, n, txt) => `<rect x="${x}" y="${y}" width="54" height="36" fill="${c}"/><text x="${x + 27}" y="${y + 24}" font-size="17" font-weight="800" fill="${txt}" text-anchor="middle" font-family="system-ui">${n}</text>`;
  const SVG = [
    `${brk(20, 24, '#845591', '220', '#fff')}${brk(140, 50, '#C9A0DC', '60', '#3a1f45')}
     <g fill="currentColor" opacity=".5">${[...Array(10)].map((_, i) => `<circle cx="${130 - i * 8}" cy="${188 - i * 12}" r="3"/>`).join('')}</g>
     <circle cx="130" cy="194" r="7" fill="currentColor"/><rect x="0" y="202" width="260" height="3" fill="#845591" opacity=".55"/>
     <text x="64" y="112" font-size="24" text-anchor="middle">👆</text>`,
    `${brk(10, 30, '#5E2A62', '700', '#fff')}${brk(72, 30, '#845591', '300', '#fff')}${brk(134, 30, '#C9A0DC', '70', '#3a1f45')}${brk(196, 30, '#E8D6F0', '5', '#3a1f45')}
     <text x="130" y="105" font-size="14" font-weight="800" fill="#7d7186" text-anchor="middle" font-family="system-ui">→  1 hit = +1  →</text>
     ${[0, 1, 2, 3].map(i => `<circle cx="${70 + i * 36}" cy="${170 - i * 16}" r="7" fill="currentColor"/>`).join('')}`,
    `<defs><radialGradient id="sg"><stop offset="0" stop-color="#e6283c" stop-opacity=".5"/><stop offset="1" stop-color="#e6283c" stop-opacity="0"/></radialGradient></defs><circle cx="130" cy="78" r="42" fill="url(#sg)"/><circle cx="130" cy="78" r="12" fill="#e6283c"/>
     ${[0, 1, 2, 3, 4].map(i => `<circle cx="${92 + i * 18}" cy="186" r="7" fill="currentColor"/>`).join('')}
     <text x="196" y="192" font-size="18" font-weight="800" fill="currentColor" font-family="system-ui">×5</text><rect x="0" y="202" width="260" height="3" fill="#845591" opacity=".55"/>`,
    `${brk(60, 160, '#A584B0', '140', '#fff')}${brk(150, 112, '#845591', '230', '#fff')}
     <path d="M87 120 L87 150 M79 142 L87 152 L95 142" stroke="#d4466a" stroke-width="4" fill="none" stroke-linecap="round"/>
     <rect x="0" y="202" width="260" height="4" fill="#d4466a"/>`,
  ];
  let slI = 0;
  function renderSlide() {
    const s = T[S.lang].s[slI];
    $('slides').innerHTML = `<div class="slide"><svg viewBox="0 0 260 214" role="img" aria-label="${s[0]}" style="color:var(--fg)">${SVG[slI]}</svg><h3>${slI + 1}. ${s[0]}</h3><p>${s[1]}</p></div>`;
    $('dots').innerHTML = SVG.map((_, i) => `<i class="${i === slI ? 'on' : ''}"></i>`).join('');
    $('prevSl').style.visibility = slI === 0 ? 'hidden' : 'visible';
    $('nextSl').textContent = slI === SVG.length - 1 ? t('got') : t('next');
  }
  $('helpBtn').onclick = () => { slI = 0; renderSlide(); openModal('helpM'); };
  $('prevSl').onclick = () => { slI = Math.max(0, slI - 1); renderSlide(); };
  $('nextSl').onclick = () => { if (slI === SVG.length - 1) closeModal('helpM'); else { slI++; renderSlide(); } };

  // =================== Bonuslar oynasi ===================
  const gl = id => `<defs><radialGradient id="${id}"><stop offset="0" stop-color="#e6283c" stop-opacity=".5"/><stop offset="1" stop-color="#e6283c" stop-opacity="0"/></radialGradient></defs><circle cx="26" cy="26" r="25" fill="url(#${id})"/>`;
  const icoDot = () => `<svg viewBox="0 0 52 52">${gl('g1')}<circle cx="26" cy="26" r="7" fill="#e6283c"/></svg>`;
  const icoAuto = () => `<svg viewBox="0 0 52 52"><path d="M26 8v20M18 21l8 8 8-8" stroke="var(--acc)" stroke-width="4" fill="none" stroke-linecap="round"/><text x="26" y="46" font-size="14" font-weight="900" fill="#e6283c" text-anchor="middle" font-family="system-ui">+1</text></svg>`;
  const icoRing = n => `<svg viewBox="0 0 52 52">${gl('g' + n)}<circle cx="26" cy="26" r="19" fill="none" stroke="#b5172b" stroke-width="3.4"/><circle cx="26" cy="26" r="14" fill="none" stroke="#ff8a99" stroke-width="2.2"/><circle cx="26" cy="26" r="11" fill="#e6283c"/><text x="26" y="30" font-size="${n >= 100 ? 7.5 : 10}" font-weight="900" fill="#fff" text-anchor="middle" font-family="system-ui">+${n}</text></svg>`;
  const icoMax = () => `<svg viewBox="0 0 52 52">${gl('gm')}<g fill="rgba(230,40,60,.35)">${[...Array(12)].map((_, k) => `<path d="M24.6 26 L26 1 L27.4 26z" transform="rotate(${k * 30} 26 26)"/>`).join('')}</g><circle cx="26" cy="26" r="17" fill="none" stroke="#b5172b" stroke-width="3"/><circle cx="26" cy="26" r="13.5" fill="none" stroke="#e6283c" stroke-width="2.4"/><circle cx="26" cy="26" r="10.8" fill="none" stroke="#ff8a99" stroke-width="1.8"/><circle cx="26" cy="26" r="9" fill="#e6283c"/><text x="26" y="26" font-size="6.5" font-weight="900" fill="#fff" text-anchor="middle" font-family="system-ui">+500</text><text x="26" y="32" font-size="4.6" font-weight="900" fill="#ffd6dc" text-anchor="middle" font-family="system-ui">MAX</text></svg>`;
  const fmt = n => n.toLocaleString(S.lang === 'ru' ? 'ru-RU' : 'en-US');
  function renderBonuses() {
    const st = i => bonusGot.includes(i) ? `<i class="ok">✓ ${t('gotIt')}</i>` : `<i>${t('soon')}</i>`;
    let h = `<div class="bitem">${icoDot()}<div><b>${t('b1')}</b><span>${t('b1d')}</span></div><i></i></div>`;
    h += `<div class="bitem">${icoAuto()}<div><b>${t('b3')}</b><span>${t('b3d')}</span></div><i></i></div>`;
    h += `<div class="bhead">${t('bm')}</div><div class="bsub">${t('bmd')}</div>`;
    MILESTONES.forEach(([th, v, max], i) => {
      h += `<div class="bitem">${max ? icoMax() : icoRing(v)}<div><b>${fmt(th)} ${t('pts')} → +${v} ${t('balls')}${max ? ' · MAX WIN' : ''}</b>${max ? `<span>${t('maxd')}</span>` : ''}</div>${st(i)}</div>`;
    });
    $('bonusList').innerHTML = h;
  }
  $('bonusBtn').onclick = () => { renderBonuses(); openModal('bonusM'); };
  $('bonusClose').onclick = () => closeModal('bonusM');

  // =================== Konfetti ===================
  const cc = $('confetti'), cx2 = cc.getContext('2d');
  let conf = [];
  function confetti() {
    cc.width = innerWidth * dpr; cc.height = innerHeight * dpr;
    const cols = ['#C9A0DC', '#845591', '#5E2A62', '#E8D6F0', '#A584B0'];
    for (let i = 0; i < 140; i++) conf.push({ x: rand(0, innerWidth), y: rand(-innerHeight * 0.5, -10), vx: rand(-40, 40), vy: rand(120, 300), r: rand(0, 6), vr: rand(-6, 6), c: cols[i % cols.length], s: rand(5, 10), life: 0 });
  }
  function drawConfetti(dt) {
    if (!conf.length) return;
    cx2.setTransform(dpr, 0, 0, dpr, 0, 0); cx2.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of conf) { p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt; cx2.save(); cx2.translate(p.x, p.y); cx2.rotate(p.r); cx2.fillStyle = p.c; cx2.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); cx2.restore(); }
    conf = conf.filter(p => p.y < innerHeight + 20 && p.life < 6);
    if (!conf.length) cx2.clearRect(0, 0, innerWidth, innerHeight);
  }

  // =================== Menyu foni ===================
  const bgBricks = Array.from({ length: 14 }, () => ({ x: Math.random(), y: Math.random(), w: rand(36, 66), v: rand(8, 22), r: rand(0, 6), n: Math.ceil(rand(1, 900)) }));
  function drawMenuBg(dt) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, innerWidth, innerHeight);
    ctx.textAlign = 'center';
    for (const b of bgBricks) {
      b.y -= b.v * dt / innerHeight; if (b.y < -0.1) { b.y = 1.1; b.x = Math.random(); }
      b.r += dt * 0.2;
      const h = b.w / 1.5;
      ctx.save(); ctx.translate(b.x * innerWidth, b.y * innerHeight); ctx.rotate(Math.sin(b.r) * 0.25);
      ctx.globalAlpha = S.dark ? 0.35 : 0.22;
      ctx.fillStyle = colorFor(b.n); ctx.fillRect(-b.w / 2, -h / 2, b.w, h);
      ctx.fillStyle = lightBrick(b.n) ? '#3a1f45' : '#fff'; ctx.font = `800 ${h * 0.42}px ui-rounded, system-ui`; centerText(String(b.n), 0, 0);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  // =================== Asosiy sikl ===================
  let last = performance.now();
  function loop(now) {
    const dt = clamp((now - last) / 1000, 0, 0.05); last = now;
    if (G && screen === 'game' && G.state === 'fire' && !G.over) updateTurn(dt);
    for (const p of parts) { p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 10 * dt; }
    parts = parts.filter(p => p.life < p.max);
    if (screen === 'menu') drawMenuBg(dt); else draw(dt);
    if (G && screen !== 'menu') updateHUD();
    drawConfetti(dt);
    requestAnimationFrame(loop);
  }

  applyTheme(); applyLang(); syncSettingsUI(); resize(); show('menu');
  requestAnimationFrame(loop);
  window.__ready = true;
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
