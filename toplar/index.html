<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Neon To'plar">
<meta name="theme-color" content="#f3f1fb">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Neon To'plar</title>
<style>
  /* Yorug' rejim (asosiy) */
  :root {
    --bg: #f3f1fb; --bg2: #e9e5fa; --board: #ffffff; --grid: rgba(60,50,120,.06); --fg: #1e1b3a; --muted: #7a7596;
    --card: #ffffff; --line: rgba(30,27,58,.1); --acc: #6c4cff; --acc2: #ff4f8b; --ball: #1e1b3a; --floor: rgba(108,76,255,.35);
    --shadow: 0 10px 30px rgba(60,40,140,.12); --chip: rgba(30,27,58,.06); --danger: #ff4f6d;
    --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); --sl: env(safe-area-inset-left, 0px); --sr: env(safe-area-inset-right, 0px);
    color-scheme: light;
  }
  /* Qorong'i rejim */
  :root.dark {
    --bg: #0c0d18; --bg2: #141530; --board: #12132a; --grid: rgba(255,255,255,.04); --fg: #f2f0ff; --muted: #9a97b8;
    --card: #1a1b36; --line: rgba(255,255,255,.1); --acc: #8b74ff; --acc2: #ff5c97; --ball: #ffffff; --floor: rgba(139,116,255,.45);
    --shadow: 0 10px 30px rgba(0,0,0,.45); --chip: rgba(255,255,255,.07); --danger: #ff5c7a;
    color-scheme: dark;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    background: radial-gradient(ellipse at 50% 0%, var(--bg2), var(--bg) 65%) var(--bg); color: var(--fg);
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, "Segoe UI", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; touch-action: none;
    transition: background-color .3s, color .3s;
  }
  [hidden] { display: none !important; }
  button { font-family: inherit; color: inherit; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  button:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
  #cv { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  .icon-btn { width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); box-shadow: var(--shadow);
    display: grid; place-items: center; padding: 0; }
  .icon-btn svg { width: 22px; height: 22px; stroke: var(--fg); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .icon-btn:active { transform: scale(.94); }

  /* ---------- Bosh menyu ---------- */
  #menu { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    padding: calc(16px + var(--st)) max(20px, var(--sr)) calc(20px + var(--sb)) max(20px, var(--sl)); box-sizing: border-box; touch-action: manipulation; }
  #menuTop { position: absolute; top: calc(12px + var(--st)); right: max(14px, var(--sr)); display: flex; gap: 10px; }
  .logo { text-align: center; }
  .logo .balls { display: flex; justify-content: center; gap: 8px; margin-bottom: 14px; }
  .logo .balls i { width: 16px; height: 16px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 14px var(--acc); animation: bob 1.4s ease-in-out infinite; }
  .logo .balls i:nth-child(2) { background: var(--acc2); box-shadow: 0 0 14px var(--acc2); animation-delay: .15s; }
  .logo .balls i:nth-child(3) { background: #2ec4ff; box-shadow: 0 0 14px #2ec4ff; animation-delay: .3s; }
  @keyframes bob { 50% { transform: translateY(-10px); } }
  .logo h1 { margin: 0; font-size: 46px; line-height: .95; font-weight: 900; letter-spacing: .02em; }
  .logo h1 span { display: block; background: linear-gradient(90deg, var(--acc), var(--acc2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .bestChip { background: var(--chip); border-radius: 999px; padding: 8px 16px; font-weight: 800; font-size: 15px; }
  .bestChip b { color: var(--acc); }
  .menuBtns { display: flex; flex-direction: column; gap: 12px; width: min(300px, 100%); }
  .big { border: 0; border-radius: 18px; padding: 18px; font-size: 21px; font-weight: 900; letter-spacing: .03em; color: #fff;
    background: linear-gradient(135deg, var(--acc), var(--acc2)); box-shadow: 0 10px 24px rgba(108,76,255,.35); }
  .big:active { transform: scale(.97); }
  .soft { border: 1px solid var(--line); border-radius: 18px; padding: 15px; font-size: 18px; font-weight: 800; background: var(--card); box-shadow: var(--shadow); }
  .soft:active { transform: scale(.97); }

  /* ---------- O'yin paneli ---------- */
  #hud { position: fixed; left: 0; right: 0; top: 0; z-index: 5; padding: calc(10px + var(--st)) max(14px, var(--sr)) 0 max(14px, var(--sl));
    display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; pointer-events: none; }
  #hud > * { pointer-events: auto; }
  .scores { text-align: center; line-height: 1.05; }
  .scores .rec { font-size: 12px; font-weight: 800; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
  .scores .rec b { color: var(--acc); font-size: 14px; }
  .scores .cur { font-size: 34px; font-weight: 900; font-variant-numeric: tabular-nums; }
  #ctrls { position: fixed; right: max(14px, var(--sr)); bottom: calc(14px + var(--sb)); z-index: 5; display: flex; gap: 10px; }
  #ctrls .icon-btn.on { background: var(--acc); border-color: var(--acc); }
  #ctrls .icon-btn.on svg { stroke: #fff; }

  /* ---------- Modallar ---------- */
  .modal { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: rgba(15,12,40,.38);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); touch-action: manipulation;
    padding: calc(16px + var(--st)) max(18px, var(--sr)) calc(16px + var(--sb)) max(18px, var(--sl)); box-sizing: border-box; animation: fade .18s ease-out; }
  @keyframes fade { from { opacity: 0; } }
  .sheet { width: min(360px, 100%); background: var(--card); border-radius: 26px; padding: 22px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px;
    animation: pop .22s cubic-bezier(.2,1.4,.4,1); max-height: 100%; overflow: auto; box-sizing: border-box; }
  @keyframes pop { from { transform: scale(.92); opacity: 0; } }
  .sheet h2 { margin: 0 0 4px; text-align: center; font-size: 26px; font-weight: 900; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 4px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 17px; }
  .row:last-of-type { border-bottom: 0; }
  .switch { width: 52px; height: 32px; border-radius: 99px; border: 0; background: var(--chip); position: relative; flex: none; transition: background .2s; padding: 0; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.25); transition: transform .2s; }
  .switch.on { background: var(--acc); } .switch.on::after { transform: translateX(20px); }
  input[type=range] { width: 130px; accent-color: var(--acc); }
  .result { text-align: center; }
  .result .n { font-size: 64px; font-weight: 900; line-height: 1; background: linear-gradient(135deg, var(--acc), var(--acc2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .result .l { color: var(--muted); font-weight: 800; letter-spacing: .1em; font-size: 12px; text-transform: uppercase; }
  .newrec { text-align: center; font-weight: 900; color: var(--acc2); font-size: 18px; }

  /* Qo'llanma */
  .slide { text-align: center; }
  .slide svg { width: 100%; max-width: 260px; height: auto; border-radius: 18px; background: var(--board); border: 1px solid var(--line); }
  .slide h3 { margin: 12px 0 4px; font-size: 20px; }
  .slide p { margin: 0; color: var(--muted); line-height: 1.45; font-size: 15px; }
  .dots { display: flex; justify-content: center; gap: 7px; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--chip); }
  .dots i.on { background: var(--acc); width: 22px; border-radius: 99px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 40; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<!-- O'yin paneli -->
<div id="hud" hidden>
  <button class="icon-btn" id="pauseBtn" type="button" aria-label="Pauza">
    <svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg>
  </button>
  <div class="scores">
    <div class="rec">Rekord <b id="recOut">0</b></div>
    <div class="cur" id="scoreOut">1</div>
  </div>
  <span></span>
</div>
<div id="ctrls" hidden>
  <button class="icon-btn" id="recallBtn" type="button" aria-label="To'plarni qaytarish">
    <svg viewBox="0 0 24 24"><path d="M12 4v14M6 12l6 6 6-6"/></svg>
  </button>
  <button class="icon-btn" id="fastBtn" type="button" aria-label="Tezlashtirish">
    <svg viewBox="0 0 24 24"><path d="M4 6l7 6-7 6zM13 6l7 6-7 6z"/></svg>
  </button>
</div>

<!-- Bosh menyu -->
<section id="menu">
  <div id="menuTop">
    <button class="icon-btn" id="helpBtn" type="button" aria-label="Qanday o'ynaladi">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.2a2.6 2.6 0 0 1 5 1c0 1.8-2.5 2.2-2.5 3.8"/><circle cx="12" cy="17.3" r=".6" fill="currentColor"/></svg>
    </button>
    <button class="icon-btn" id="setBtn" type="button" aria-label="Sozlamalar">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
  <div class="logo">
    <div class="balls"><i></i><i></i><i></i></div>
    <h1>NEON<span>TO'PLAR</span></h1>
  </div>
  <div class="bestChip">🏆 Rekord: <b id="menuBest">0</b></div>
  <div class="menuBtns">
    <button class="big" id="continueBtn" type="button" hidden>▶ DAVOM ETISH</button>
    <button class="big" id="startBtn" type="button">▶ BOSHLASH</button>
  </div>
</section>

<!-- Pauza -->
<section id="pauseM" class="modal" hidden>
  <div class="sheet">
    <h2>Pauza</h2>
    <button class="big" id="resumeBtn" type="button">▶ Davom etish</button>
    <button class="soft" id="restartBtn" type="button">↻ Qaytadan boshlash</button>
    <div class="two">
      <button class="soft" id="pSetBtn" type="button">⚙️ Sozlamalar</button>
      <button class="soft" id="pMenuBtn" type="button">⌂ Menyu</button>
    </div>
  </div>
</section>

<!-- Sozlamalar -->
<section id="setM" class="modal" hidden>
  <div class="sheet">
    <h2>Sozlamalar</h2>
    <div class="row"><span>🎵 Musiqa</span><button class="switch" id="swMusic" type="button" aria-label="Musiqa"></button></div>
    <div class="row"><span>🔊 Ovoz effektlari</span><button class="switch" id="swSfx" type="button" aria-label="Ovoz effektlari"></button></div>
    <div class="row"><span>🎚 Balandlik</span><input id="vol" type="range" min="0" max="1" step="0.05" aria-label="Ovoz balandligi"></div>
    <div class="row"><span>🌙 Qorong'i rejim</span><button class="switch" id="swDark" type="button" aria-label="Qorong'i rejim"></button></div>
    <button class="big" id="setClose" type="button">Tayyor</button>
  </div>
</section>

<!-- Qo'llanma -->
<section id="helpM" class="modal" hidden>
  <div class="sheet">
    <div id="slides"></div>
    <div class="dots" id="dots"></div>
    <div class="two">
      <button class="soft" id="prevSl" type="button">‹ Orqaga</button>
      <button class="big" id="nextSl" type="button">Keyingi ›</button>
    </div>
  </div>
</section>

<!-- O'yin tugadi -->
<section id="overM" class="modal" hidden>
  <div class="sheet">
    <h2>O'yin tugadi</h2>
    <div class="result"><div class="n" id="finalScore">0</div><div class="l">Ball</div></div>
    <div class="newrec" id="newRec" hidden>🎉 Yangi rekord!</div>
    <div class="bestChip" style="text-align:center">🏆 Rekord: <b id="overBest">0</b></div>
    <button class="big" id="againBtn" type="button">↻ Qaytadan</button>
    <button class="soft" id="overMenuBtn" type="button">⌂ Bosh menyu</button>
  </div>
</section>

<canvas id="confetti"></canvas>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d');
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const store = {
    get(k, d) { try { const v = localStorage.getItem('toplar.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('toplar.' + k, JSON.stringify(v)); } catch (e) {} },
    del(k) { try { localStorage.removeItem('toplar.' + k); } catch (e) {} },
  };

  // =================== Sozlamalar ===================
  const S = Object.assign({ music: true, sfx: true, vol: 0.7, dark: false }, store.get('settings', {}));
  let best = store.get('best', 0);
  function applyTheme() {
    document.documentElement.classList.toggle('dark', S.dark);
    document.querySelector('meta[name=theme-color]').content = S.dark ? '#0c0d18' : '#f3f1fb';
    readColors();
  }
  let C = {};
  function readColors() {
    const cs = getComputedStyle(document.documentElement);
    for (const k of ['board', 'grid', 'fg', 'muted', 'acc', 'acc2', 'ball', 'floor', 'danger']) C[k] = cs.getPropertyValue('--' + k).trim();
  }
  function syncSettingsUI() {
    $('swMusic').classList.toggle('on', S.music); $('swSfx').classList.toggle('on', S.sfx); $('swDark').classList.toggle('on', S.dark);
    $('vol').value = S.vol;
  }
  const saveSettings = () => { store.set('settings', S); syncSettingsUI(); if (master) master.gain.value = S.vol; };
  $('swMusic').onclick = () => { S.music = !S.music; saveSettings(); unlockAudio(); };
  $('swSfx').onclick = () => { S.sfx = !S.sfx; saveSettings(); unlockAudio(); sfx.pick(); };
  $('swDark').onclick = () => { S.dark = !S.dark; applyTheme(); saveSettings(); };
  $('vol').oninput = () => { S.vol = +$('vol').value; saveSettings(); };

  // =================== Ovoz va musiqa ===================
  let actx = null, master = null, musicBus = null, musicTimer = null, nextNote = 0, step = 0;
  function unlockAudio() {
    if (!actx) {
      try {
        actx = new (window.AudioContext || window.webkitAudioContext)();
        master = actx.createGain(); master.gain.value = S.vol; master.connect(actx.destination);
        musicBus = actx.createGain(); musicBus.gain.value = 0.5; musicBus.connect(master);
      } catch (e) { return; }
    }
    if (actx.state === 'suspended') actx.resume();
    if (!musicTimer) musicTimer = setInterval(scheduleMusic, 100);
  }
  function tone(f, len, vol, type = 'sine', when = 0, bus = master, f2 = null) {
    if (!actx) return;
    const t = actx.currentTime + when, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + len);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    o.connect(g); g.connect(bus); o.start(t); o.stop(t + len + 0.02);
  }
  let lastHit = 0;
  const sfx = {
    hit(n) { if (!S.sfx || !actx || actx.currentTime - lastHit < 0.025) return; lastHit = actx.currentTime; tone(520 + Math.min(n, 30) * 18, 0.06, 0.08, 'triangle'); },
    brk() { if (!S.sfx) return; tone(880, 0.12, 0.12, 'square', 0, master, 1320); tone(1320, 0.1, 0.06, 'triangle', 0.03); },
    pick() { if (!S.sfx) return; tone(660, 0.1, 0.1, 'sine'); tone(990, 0.14, 0.1, 'sine', 0.07); },
    shoot() { if (!S.sfx) return; tone(300, 0.08, 0.08, 'sine', 0, master, 600); },
    over() { if (!S.sfx) return; [392, 330, 262, 196].forEach((f, i) => tone(f, 0.3, 0.12, 'triangle', i * 0.15)); },
    record() { if (!S.sfx) return; [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.25, 0.12, 'triangle', i * 0.09)); },
  };
  // Yengil fon musiqasi: pentatonika ustida sekin arpedjio
  const SCALE = [0, 2, 4, 7, 9];
  function noteFreq(n) { return 261.63 * Math.pow(2, n / 12); }
  function scheduleMusic() {
    if (!actx || !S.music || document.hidden) { if (actx) nextNote = actx.currentTime + 0.1; return; }
    const beat = 0.34;
    while (nextNote < actx.currentTime + 0.3) {
      const when = Math.max(0, nextNote - actx.currentTime);
      const chord = [0, 5, 3, 4][Math.floor(step / 16) % 4];
      if (step % 2 === 0) {
        const deg = SCALE[(step / 2 + chord + (Math.random() < 0.3 ? 2 : 0)) % 5];
        tone(noteFreq(deg + 12 * (Math.random() < 0.25 ? 1 : 0)), 0.5, 0.05, 'triangle', when, musicBus);
      }
      if (step % 8 === 0) tone(noteFreq(SCALE[chord % 5] - 24), 1.4, 0.07, 'sine', when, musicBus);
      step++; nextNote += beat / 2;
    }
  }

  // =================== Maydon o'lchami ===================
  const COLS = 7, ROWS = 8, FLOOR = 8.85, BOARD_H = 9.1, R = 0.13, SPEED = 17, GAP = 0.07;
  let unit = 50, ox = 0, oy = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    const w = innerWidth, h = innerHeight;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    const cs = getComputedStyle(document.documentElement);
    const st = parseFloat(getComputedStyle($('hud')).paddingTop) || 10;
    const topSpace = st + 62, botSpace = 74 + (parseFloat(cs.getPropertyValue('--sb')) || 0);
    const availW = w - 24, availH = h - topSpace - botSpace;
    unit = Math.min(availW / COLS, availH / BOARD_H);
    ox = (w - unit * COLS) / 2; oy = topSpace + (availH - unit * BOARD_H) / 2;
  }
  addEventListener('resize', resize);

  // =================== O'yin holati ===================
  let G = null;
  function newGame() {
    G = { level: 1, balls: 1, launchX: COLS / 2, bricks: [], picks: [], state: 'aim', flying: [], fired: 0, fireT: 0, firstLand: null,
      pending: 0, turnT: 0, fast: false, over: false };
    spawnRow(1);
    shiftDown();
    G.state = 'aim';
    store.set('save', snapshot());
  }
  function snapshot() {
    return { level: G.level, balls: G.balls, launchX: G.launchX, bricks: G.bricks.map(b => ({ c: b.c, r: b.r, hp: b.hp, max: b.max, hue: b.hue })), picks: G.picks.map(p => ({ c: p.c, r: p.r })) };
  }
  function restore(s) {
    G = { level: s.level, balls: s.balls, launchX: s.launchX, bricks: s.bricks.map(b => ({ ...b, flash: 0, scale: 1 })), picks: s.picks.map(p => ({ ...p, t: 0 })),
      state: 'aim', flying: [], fired: 0, fireT: 0, firstLand: null, pending: 0, turnT: 0, fast: false, over: false };
  }
  function hueFor(hp) { return (250 + Math.log2(hp + 1) * 38) % 360; }
  function spawnRow(level) {
    const cells = [0, 1, 2, 3, 4, 5, 6].sort(() => Math.random() - 0.5);
    let count = Math.random() < 0.5 ? 2 + Math.floor(Math.random() * 3) : 3 + Math.floor(Math.random() * 3);
    if (level < 3) count = Math.min(count, 3);
    for (let i = 0; i < count; i++) {
      let hp = level;
      if (level > 4 && Math.random() < 0.18) hp = level * 2;
      G.bricks.push({ c: cells[i], r: -1, hp, max: hp, hue: hueFor(hp), flash: 0, scale: 0.3 });
    }
    G.picks.push({ c: cells[count], r: -1, t: Math.random() * 6 });
  }
  function shiftDown() {
    for (const b of G.bricks) b.r++;
    for (const p of G.picks) p.r++;
    G.picks = G.picks.filter(p => { if (p.r >= ROWS) { G.balls++; return false; } return true; });
  }

  // =================== Mo'ljal ===================
  let aim = null;
  function launchPos() { return { x: G.launchX, y: FLOOR - R }; }
  function toBoard(e) { return { x: (e.clientX - ox) / unit, y: (e.clientY - oy) / unit }; }
  function aimDir(p) {
    const l = launchPos();
    let dx = p.x - l.x, dy = p.y - l.y;
    if (dy > -0.25) return null;
    const len = Math.hypot(dx, dy); dx /= len; dy /= len;
    const minY = Math.sin(8 * Math.PI / 180);
    if (-dy < minY) { dy = -minY; dx = Math.sign(dx) * Math.cos(8 * Math.PI / 180); }
    return { x: dx, y: dy };
  }
  function rayCast(x, y, dx, dy) {
    let tMin = Infinity, nx = 0, ny = 0;
    if (dx < 0) { const t = (R - x) / dx; if (t < tMin) { tMin = t; nx = 1; ny = 0; } }
    if (dx > 0) { const t = (COLS - R - x) / dx; if (t < tMin) { tMin = t; nx = -1; ny = 0; } }
    if (dy < 0) { const t = (R - y) / dy; if (t < tMin) { tMin = t; nx = 0; ny = 1; } }
    for (const b of G.bricks) {
      const x0 = b.c + GAP / 2 - R, x1 = b.c + 1 - GAP / 2 + R, y0 = b.r + GAP / 2 - R, y1 = b.r + 1 - GAP / 2 + R;
      let t0 = -Infinity, t1 = Infinity, n0x = 0, n0y = 0;
      if (dx !== 0) { let a = (x0 - x) / dx, c = (x1 - x) / dx; let na = -1; if (a > c) { [a, c] = [c, a]; na = 1; } if (a > t0) { t0 = a; n0x = na; n0y = 0; } t1 = Math.min(t1, c); }
      else if (x < x0 || x > x1) continue;
      if (dy !== 0) { let a = (y0 - y) / dy, c = (y1 - y) / dy; let na = -1; if (a > c) { [a, c] = [c, a]; na = 1; } if (a > t0) { t0 = a; n0x = 0; n0y = na; } t1 = Math.min(t1, c); }
      else if (y < y0 || y > y1) continue;
      if (t0 <= t1 && t0 > 0 && t0 < tMin) { tMin = t0; nx = n0x; ny = n0y; }
    }
    return { t: tMin, nx, ny };
  }

  // =================== Otish va fizika ===================
  function fire(dir) {
    G.state = 'fire'; G.dir = dir; G.fired = 0; G.fireT = 0; G.firstLand = null; G.flying = []; G.turnT = 0; G.fast = false;
    $('fastBtn').classList.remove('on');
    sfx.shoot();
  }
  function stepBall(b, dt) {
    let rem = dt;
    while (rem > 0) {
      const h = Math.min(rem, 0.04 / SPEED);
      rem -= h;
      b.x += b.vx * h; b.y += b.vy * h;
      if (b.x < R) { b.x = R; b.vx = Math.abs(b.vx); }
      if (b.x > COLS - R) { b.x = COLS - R; b.vx = -Math.abs(b.vx); }
      if (b.y < R) { b.y = R; b.vy = Math.abs(b.vy); }
      // g'ishtlar
      const bc = Math.floor(b.x), br = Math.floor(b.y);
      let hitDone = false;
      for (const k of G.bricks) {
        if (k.hp <= 0 || Math.abs(k.c - bc) > 1 || Math.abs(k.r - br) > 1) continue;
        const x0 = k.c + GAP / 2, x1 = k.c + 1 - GAP / 2, y0 = k.r + GAP / 2, y1 = k.r + 1 - GAP / 2;
        const qx = clamp(b.x, x0, x1), qy = clamp(b.y, y0, y1);
        let dx = b.x - qx, dy = b.y - qy; const d2 = dx * dx + dy * dy;
        if (d2 >= R * R) continue;
        let d = Math.sqrt(d2);
        if (d < 1e-6) { dx = -b.vx; dy = -b.vy; d = Math.hypot(dx, dy); }
        const nx = dx / d, ny = dy / d;
        b.x = qx + nx * (R + 1e-4); b.y = qy + ny * (R + 1e-4);
        const vn = b.vx * nx + b.vy * ny;
        if (vn < 0) { b.vx -= 2 * vn * nx; b.vy -= 2 * vn * ny; }
        if (!hitDone) { hitBrick(k); hitDone = true; }
      }
      // gorizontal aylanib qolmaslik uchun
      if (Math.abs(b.vy) < SPEED * 0.12) { b.vy = (b.vy <= 0 ? -1 : 1) * SPEED * 0.12; const s = Math.hypot(b.vx, b.vy); b.vx *= SPEED / s; b.vy *= SPEED / s; }
      // bonus to'plar
      for (const p of G.picks) {
        if (p.got) continue;
        if (Math.hypot(b.x - (p.c + 0.5), b.y - (p.r + 0.5)) < R + 0.28) { p.got = true; G.pending++; sfx.pick(); burst(p.c + 0.5, p.r + 0.5, C.acc2, 10); }
      }
      // pol
      if (b.y >= FLOOR - R && b.vy > 0) {
        b.y = FLOOR - R; b.state = 'land';
        if (G.firstLand === null) G.firstLand = clamp(b.x, R, COLS - R);
        return;
      }
    }
  }
  let hitCount = 0;
  function hitBrick(k) {
    k.hp--; k.flash = 1; hitCount++;
    sfx.hit(hitCount % 30);
    if (k.hp <= 0) {
      burst(k.c + 0.5, k.r + 0.5, `hsl(${k.hue},90%,60%)`, 16);
      shake = Math.min(shake + 0.06, 0.18);
      sfx.brk();
    }
  }
  function updateTurn(dt) {
    const sp = G.fast ? 3 : 1;
    dt *= sp;
    G.turnT += dt / sp;
    if (G.turnT > 2.2 && $('fastBtn').hidden) $('fastBtn').hidden = false;
    // ketma-ket otish
    if (G.fired < G.balls) {
      G.fireT -= dt;
      while (G.fireT <= 0 && G.fired < G.balls) {
        const l = launchPos();
        G.flying.push({ x: l.x, y: l.y, vx: G.dir.x * SPEED, vy: G.dir.y * SPEED, state: 'fly' });
        G.fired++; G.fireT += 0.07;
      }
    }
    for (const b of G.flying) {
      if (b.state === 'fly') stepBall(b, dt);
      else if (b.state === 'land') {
        const tx = G.firstLand ?? G.launchX;
        const d = tx - b.x, s = 28 * dt;
        if (Math.abs(d) <= s) { b.x = tx; b.state = 'done'; } else b.x += Math.sign(d) * s;
      }
    }
    G.bricks = G.bricks.filter(k => k.hp > 0);
    G.picks = G.picks.filter(p => !(p.got && (p.fade = (p.fade || 0) + dt) > 0.3));
    if (G.fired >= G.balls && G.flying.every(b => b.state === 'done')) endTurn();
  }
  function recall() {
    if (G.state !== 'fire') return;
    G.fired = G.balls;
    if (G.firstLand === null) G.firstLand = G.launchX;
    for (const b of G.flying) if (b.state === 'fly') { b.state = 'land'; b.y = FLOOR - R; }
  }
  function endTurn() {
    G.balls += G.pending; G.pending = 0;
    G.picks = G.picks.filter(p => !p.got);
    G.launchX = G.firstLand ?? G.launchX;
    G.flying = []; G.state = 'aim'; G.fast = false; hitCount = 0;
    $('fastBtn').hidden = true; $('fastBtn').classList.remove('on');
    G.level++;
    spawnRow(G.level);
    shiftDown();
    if (G.bricks.some(b => b.r >= ROWS)) { gameOver(); return; }
    store.set('save', snapshot());
  }

  // =================== Effektlar ===================
  let parts = [], shake = 0;
  function burst(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), s = rand(1.5, 5);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, life: 0, max: rand(0.35, 0.7), color, size: rand(0.05, 0.11) });
    }
  }

  // =================== Chizish ===================
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }
  function draw(dt) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    if (!G) return;
    const sx = shake > 0 ? rand(-shake, shake) * unit : 0, sy = shake > 0 ? rand(-shake, shake) * unit : 0;
    ctx.translate(ox + sx, oy + sy); ctx.scale(unit, unit);
    // maydon
    ctx.fillStyle = C.board; ctx.shadowColor = 'rgba(40,20,120,.15)'; ctx.shadowBlur = 24 / unit * unit; ctx.shadowOffsetY = 6;
    rr(-0.08, -0.08, COLS + 0.16, BOARD_H + 0.12, 0.35); ctx.fill();
    ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    ctx.strokeStyle = C.grid; ctx.lineWidth = 1 / unit;
    ctx.beginPath();
    for (let c = 1; c < COLS; c++) { ctx.moveTo(c, 0); ctx.lineTo(c, FLOOR); }
    for (let r = 1; r < ROWS + 1; r++) { ctx.moveTo(0, r); ctx.lineTo(COLS, r); }
    ctx.stroke();
    // pol chizig'i
    ctx.strokeStyle = C.floor; ctx.lineWidth = 2.5 / unit;
    ctx.beginPath(); ctx.moveTo(0.1, FLOOR); ctx.lineTo(COLS - 0.1, FLOOR); ctx.stroke();
    // xavfli qator (eng pastki qator) — nozik qizil ishora
    if (G.bricks.some(b => b.r === ROWS - 1)) {
      ctx.fillStyle = C.danger; ctx.globalAlpha = 0.07 + 0.05 * Math.sin(perfT * 6);
      ctx.fillRect(0, ROWS - 1, COLS, 1); ctx.globalAlpha = 1;
    }
    // g'ishtlar
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const b of G.bricks) {
      b.flash = Math.max(0, b.flash - dt * 6); b.scale += (1 - b.scale) * Math.min(1, dt * 12);
      const frac = clamp(b.hp / b.max, 0, 1);
      // son kamaygan sari rang ochroq bo'ladi
      const L = S.dark ? 50 + (1 - frac) * 28 : 52 + (1 - frac) * 30;
      const Sat = 92 - (1 - frac) * 35;
      const s = b.scale * (1 - b.flash * 0.06), w = (1 - GAP) * s, x = b.c + 0.5 - w / 2, y = b.r + 0.5 - w / 2;
      ctx.fillStyle = `hsl(${b.hue},${Sat}%,${L + b.flash * 12}%)`;
      if (S.dark) { ctx.shadowColor = `hsla(${b.hue},100%,60%,${0.35 + 0.4 * frac})`; ctx.shadowBlur = 14; }
      rr(x, y, w, w, 0.16); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,.22)'; rr(x + 0.06, y + 0.05, w - 0.12, 0.14, 0.07); ctx.fill();
      ctx.fillStyle = L > 70 ? `hsl(${b.hue},60%,22%)` : '#ffffff';
      ctx.font = `900 ${(b.hp > 999 ? 0.28 : b.hp > 99 ? 0.33 : 0.4)}px ui-rounded, -apple-system, system-ui, sans-serif`;
      ctx.fillText(String(b.hp), b.c + 0.5, b.r + 0.53);
    }
    // bonus +1
    for (const p of G.picks) {
      p.t += dt;
      const a = p.got ? 1 - (p.fade || 0) / 0.3 : 1;
      const pr = 0.24 + Math.sin(p.t * 5) * 0.03;
      ctx.globalAlpha = a;
      ctx.strokeStyle = C.acc2; ctx.lineWidth = 0.06;
      ctx.beginPath(); ctx.arc(p.c + 0.5, p.r + 0.5, pr, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = C.acc2; ctx.beginPath(); ctx.arc(p.c + 0.5, p.r + 0.5, 0.1, 0, Math.PI * 2); ctx.fill();
      ctx.font = '900 0.2px ui-rounded, -apple-system, system-ui, sans-serif';
      ctx.fillText('+1', p.c + 0.5, p.r + 0.5 - pr - 0.14);
      ctx.globalAlpha = 1;
    }
    // mo'ljal chizig'i
    if (G.state === 'aim' && aim && aim.dir) {
      const l = launchPos(), d = aim.dir;
      const hit = rayCast(l.x, l.y, d.x, d.y);
      const t = Math.min(hit.t, 14);
      ctx.fillStyle = C.ball; ctx.globalAlpha = 0.55;
      for (let s = 0.35; s < t; s += 0.32) { ctx.beginPath(); ctx.arc(l.x + d.x * s, l.y + d.y * s, 0.045, 0, Math.PI * 2); ctx.fill(); }
      const hx = l.x + d.x * t, hy = l.y + d.y * t;
      ctx.globalAlpha = 0.8; ctx.strokeStyle = C.ball; ctx.lineWidth = 0.035;
      ctx.beginPath(); ctx.arc(hx, hy, R, 0, Math.PI * 2); ctx.stroke();
      // qaytish yo'nalishi
      let rx = d.x, ry = d.y; if (hit.nx) rx = -rx; if (hit.ny) ry = -ry;
      ctx.globalAlpha = 0.3;
      for (let s = 0.3; s < 1.3; s += 0.32) { ctx.beginPath(); ctx.arc(hx + rx * s, hy + ry * s, 0.035, 0, Math.PI * 2); ctx.fill(); }
      ctx.globalAlpha = 1;
    }
    // to'plar
    ctx.fillStyle = C.ball;
    if (S.dark) { ctx.shadowColor = '#b9a8ff'; ctx.shadowBlur = 10; }
    if (G.state === 'aim' || G.fired < G.balls) {
      const l = launchPos(); ctx.beginPath(); ctx.arc(l.x, l.y, R, 0, Math.PI * 2); ctx.fill();
    }
    for (const b of G.flying) { ctx.beginPath(); ctx.arc(b.x, b.y, R, 0, Math.PI * 2); ctx.fill(); }
    ctx.shadowBlur = 0;
    // to'p soni
    const rest = G.state === 'aim' ? G.balls : G.balls - G.fired;
    if (rest > 0) {
      const l = launchPos();
      ctx.font = '900 0.3px ui-rounded, -apple-system, system-ui, sans-serif'; ctx.fillStyle = C.fg;
      ctx.textAlign = l.x > COLS - 1 ? 'right' : 'left';
      ctx.fillText(`×${rest}`, l.x + (l.x > COLS - 1 ? -0.25 : 0.25), l.y + 0.02);
      ctx.textAlign = 'center';
    }
    if (G.pending > 0 && G.state === 'fire') {
      ctx.font = '900 0.26px ui-rounded, -apple-system, system-ui, sans-serif'; ctx.fillStyle = C.acc2;
      ctx.fillText(`+${G.pending}`, (G.firstLand ?? G.launchX), FLOOR + 0.2);
    }
    // zarrachalar
    for (const p of parts) {
      ctx.globalAlpha = 1 - p.life / p.max; ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
  }

  let conf = [];
  function confetti() {
    cc.width = innerWidth * dpr; cc.height = innerHeight * dpr;
    const cols = ['#6c4cff', '#ff4f8b', '#2ec4ff', '#ffd23f', '#5dff8f'];
    for (let i = 0; i < 140; i++) conf.push({ x: rand(0, innerWidth), y: rand(-innerHeight * 0.5, -10), vx: rand(-40, 40), vy: rand(120, 300), r: rand(0, 6), vr: rand(-6, 6), c: cols[i % cols.length], s: rand(5, 10), life: 0 });
  }
  function drawConfetti(dt) {
    if (!conf.length) return;
    cx2.setTransform(dpr, 0, 0, dpr, 0, 0); cx2.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of conf) { p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt; cx2.save(); cx2.translate(p.x, p.y); cx2.rotate(p.r); cx2.fillStyle = p.c; cx2.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); cx2.restore(); }
    conf = conf.filter(p => p.y < innerHeight + 20 && p.life < 6);
    if (!conf.length) cx2.clearRect(0, 0, innerWidth, innerHeight);
  }

  // =================== Asosiy sikl ===================
  let last = performance.now(), perfT = 0;
  function loop(now) {
    const dt = clamp((now - last) / 1000, 0, 0.05); last = now; perfT += dt;
    if (G && screen === 'game' && G.state === 'fire' && !G.over) updateTurn(dt);
    for (const p of parts) { p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 12 * dt; }
    parts = parts.filter(p => p.life < p.max);
    shake = Math.max(0, shake - dt * 0.8);
    if (screen === 'menu') drawMenuBg(dt); else draw(dt);
    if (G && screen !== 'menu') updateHUD();
    drawConfetti(dt);
    requestAnimationFrame(loop);
  }
  // Menyu foni: sekin suzib yuruvchi g'ishtlar
  const bgBricks = Array.from({ length: 14 }, () => ({ x: Math.random(), y: Math.random(), s: rand(26, 54), h: rand(240, 340), v: rand(8, 22), r: rand(0, 6), n: Math.ceil(rand(1, 40)) }));
  function drawMenuBg(dt) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const b of bgBricks) {
      b.y -= b.v * dt / innerHeight; if (b.y < -0.1) { b.y = 1.1; b.x = Math.random(); }
      b.r += dt * 0.2;
      ctx.save(); ctx.translate(b.x * innerWidth, b.y * innerHeight); ctx.rotate(Math.sin(b.r) * 0.3);
      ctx.globalAlpha = S.dark ? 0.22 : 0.16;
      ctx.fillStyle = `hsl(${b.h},85%,${S.dark ? 60 : 62}%)`; rr(-b.s / 2, -b.s / 2, b.s, b.s, b.s * 0.18); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = `900 ${b.s * 0.4}px ui-rounded, system-ui`; ctx.fillText(b.n, 0, 2);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  applyTheme(); syncSettingsUI(); resize(); show('menu');
  requestAnimationFrame(loop);
  window.__ready = true;
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
