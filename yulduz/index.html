<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Yulduz Ovchisi">
<meta name="theme-color" content="#120c35">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Yulduz Ovchisi</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #120c35; overscroll-behavior: none; }
  body { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none;
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif; color: #fff; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #safe { position: fixed; inset: 0; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  #install {
    position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    background: rgba(255,255,255,.95); color: #1d1450; border-radius: 18px; padding: 14px 44px 14px 16px;
    font-size: 15px; line-height: 1.4; box-shadow: 0 10px 30px rgba(0,0,0,.4); touch-action: manipulation;
  }
  #install b { color: #6b2bd9; }
  #install button { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border: 0; border-radius: 50%;
    background: #ece6ff; color: #1d1450; font-size: 18px; font-weight: 800; }
  [hidden] { display: none !important; }
  #pauseBtn {
    position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%);
    width: 46px; height: 46px; border-radius: 50%; border: 0; background: rgba(255,255,255,.18); color: #fff;
    font-size: 17px; font-weight: 900; letter-spacing: 1px; touch-action: manipulation; font-family: inherit;
  }
  #pauseBtn:active { background: rgba(255,255,255,.3); }
  #pause { position: fixed; inset: 0; background: rgba(10,5,40,.72); display: grid; place-items: center; padding: 24px; touch-action: manipulation; }
  #pause .box { width: min(300px, 100%); display: flex; flex-direction: column; gap: 12px; text-align: center; }
  #pause h2 { margin: 0 0 6px; font-size: 32px; color: #ffe066; }
  #pause button {
    font-family: inherit; font-size: 19px; font-weight: 800; border: 0; border-radius: 16px; padding: 16px;
    background: rgba(255,255,255,.14); color: #fff; touch-action: manipulation;
  }
  #pause button.main { background: #ffd23f; color: #2a1c00; }
  #pause button:active { transform: scale(.97); }
</style>
</head>
<body>
<canvas id="c" aria-label="Yulduz Ovchisi o'yini"></canvas>
<div id="safe"></div>
<button id="pauseBtn" type="button" aria-label="Pauza" hidden>❚❚</button>
<div id="pause" hidden>
  <div class="box">
    <h2>Pauza</h2>
    <button id="resumeBtn" class="main" type="button">▶ Davom etish</button>
    <button id="restartBtn" type="button">↻ Qaytadan boshlash</button>
    <button id="menuBtn" type="button">⌂ Bosh menyu</button>
  </div>
</div>
<div id="install" hidden>
  📲 <b>Ilova qilib o'rnatish:</b> pastdagi <b>Ulashish ⬆</b> tugmasini bosing va <b>"Bosh ekranga qo'shish"</b> ni tanlang.
  <button id="installClose" type="button" aria-label="Yopish">×</button>
</div>
<script>
(() => {
  'use strict';
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const safeEl = document.getElementById('safe');
  const FONT = 'ui-rounded, "SF Pro Rounded", system-ui, -apple-system, sans-serif';

  // ---------- O'lcham ----------
  let W = 0, H = 0, dpr = 1;
  const safe = { t: 0, r: 0, b: 0, l: 0 };
  let bgStars = [];
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    const cs = getComputedStyle(safeEl);
    safe.t = parseFloat(cs.paddingTop) || 0; safe.r = parseFloat(cs.paddingRight) || 0;
    safe.b = parseFloat(cs.paddingBottom) || 0; safe.l = parseFloat(cs.paddingLeft) || 0;
    bgStars = Array.from({ length: Math.round(W * H / 2500) }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.5 + 0.4, tw: Math.random() * 6 }));
  }
  addEventListener('resize', resize);
  resize();

  const rand = (a, b) => a + Math.random() * (b - a);
  let best = 0;
  try { best = +localStorage.getItem('yulduz.best') || 0; } catch (e) {}

  // ---------- Ovoz ----------
  let actx = null;
  function unlock() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } else if (actx.state === 'suspended') actx.resume(); }
  function beep(f1, f2, len, vol, type = 'triangle') {
    if (!actx) return;
    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + len);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + len);
  }

  // ---------- Holat ----------
  const ROUND = 30;
  let state = 'menu', stars = [], parts = [], pops = [], score = 0, timeLeft = ROUND, spawnT = 0, time = 0, overAt = 0, combo = 0;

  let hintWanted = false;
  const hintEl = () => document.getElementById('install');
  const pauseBtn = document.getElementById('pauseBtn'), pauseEl = document.getElementById('pause');
  function setUI() {
    pauseBtn.hidden = state !== 'play';
    pauseEl.hidden = state !== 'paused';
  }
  function pause() { if (state === 'play') { state = 'paused'; setUI(); } }
  function resume() { if (state === 'paused') { state = 'play'; last = performance.now(); setUI(); } }
  function toMenu() { state = 'menu'; stars = []; setUI(); if (hintWanted) hintEl().hidden = false; }
  pauseBtn.onclick = () => { unlock(); pause(); };
  document.getElementById('resumeBtn').onclick = resume;
  document.getElementById('restartBtn').onclick = () => start();
  document.getElementById('menuBtn').onclick = toMenu;
  function start() {
    hintEl().hidden = true;
    state = 'play';
    setTimeout(setUI, 0); stars = []; parts = []; pops = []; score = 0; timeLeft = ROUND; spawnT = 0.3; combo = 0;
  }

  function spawn() {
    const r = Math.min(W, H) * rand(0.07, 0.095);
    const top = safe.t + 90, bottom = H - safe.b - 30;
    const kind = Math.random() < 0.12 ? 'gold' : Math.random() < 0.15 ? 'cloud' : 'star';
    const elapsed = ROUND - timeLeft;
    stars.push({
      x: rand(safe.l + r + 10, W - safe.r - r - 10),
      y: rand(top + r, bottom - r),
      r: kind === 'gold' ? r * 0.85 : r,
      kind, age: 0,
      life: (kind === 'gold' ? 1.0 : 1.6) - elapsed * 0.02,
      hue: rand(0, 360), rot: rand(0, 6),
    });
  }

  function burst(x, y, n, hues) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), s = rand(80, 320);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0, max: rand(0.4, 0.8), hue: hues[i % hues.length], size: rand(2, 5) });
    }
  }

  // ---------- Teginish ----------
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    unlock();
    const x = e.clientX, y = e.clientY;
    if (state === 'menu') { start(); return; }
    if (state === 'over') { if (performance.now() - overAt > 800) start(); return; }
    for (let i = stars.length - 1; i >= 0; i--) {
      const s = stars[i];
      if (Math.hypot(x - s.x, y - s.y) < s.r * 1.25) {
        stars.splice(i, 1);
        if (s.kind === 'cloud') {
          score = Math.max(0, score - 3); combo = 0;
          burst(s.x, s.y, 14, [230, 250, 270]);
          pops.push({ x: s.x, y: s.y, txt: '−3', color: '#9aa4ff', life: 0 });
          beep(300, 90, 0.3, 0.12, 'sawtooth');
          if (navigator.vibrate) try { navigator.vibrate(60); } catch (err) {}
        } else {
          combo++;
          const pts = (s.kind === 'gold' ? 3 : 1) + (combo >= 10 ? 1 : 0);
          score += pts;
          burst(s.x, s.y, s.kind === 'gold' ? 24 : 14, s.kind === 'gold' ? [45, 50, 55] : [s.hue, (s.hue + 40) % 360, 50]);
          pops.push({ x: s.x, y: s.y, txt: '+' + pts, color: s.kind === 'gold' ? '#ffe066' : '#fff', life: 0 });
          beep(s.kind === 'gold' ? 900 : 600 + Math.min(combo, 15) * 40, s.kind === 'gold' ? 1800 : 1200, 0.12, 0.12);
        }
        return;
      }
    }
    combo = 0;
  });
  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  document.addEventListener('gesturestart', e => e.preventDefault());

  // ---------- Yangilash ----------
  function update(dt) {
    time += dt;
    for (const p of parts) { p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 400 * dt; p.vx *= 0.97; }
    parts = parts.filter(p => p.life < p.max);
    for (const p of pops) { p.life += dt; p.y -= 60 * dt; }
    pops = pops.filter(p => p.life < 0.8);
    if (state !== 'play') return;

    timeLeft -= dt;
    if (timeLeft <= 0) {
      timeLeft = 0; state = 'over'; overAt = performance.now(); stars = [];
      if (hintWanted) hintEl().hidden = false;
      if (score > best) { best = score; try { localStorage.setItem('yulduz.best', String(best)); } catch (e) {} }
      beep(500, 1000, 0.3, 0.1, 'square');
      setUI();
      return;
    }
    spawnT -= dt;
    if (spawnT <= 0) {
      spawn();
      const elapsed = ROUND - timeLeft;
      spawnT = Math.max(0.28, 0.75 - elapsed * 0.015);
    }
    for (const s of stars) { s.age += dt; s.rot += dt; }
    const before = stars.length;
    stars = stars.filter(s => s.age < s.life);
    if (stars.length < before) combo = 0;
  }

  // ---------- Chizish ----------
  function starPath(x, y, r, rot) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = rot + i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * 0.45 : r;
      ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.closePath();
  }
  function text(s, x, y, size, color, align = 'center', weight = 800) {
    ctx.font = `${weight} ${size}px ${FONT}`;
    ctx.textAlign = align; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round'; ctx.lineWidth = size * 0.18; ctx.strokeStyle = 'rgba(10,5,40,.7)';
    ctx.strokeText(s, x, y);
    ctx.fillStyle = color; ctx.fillText(s, x, y);
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#120c35'); g.addColorStop(0.6, '#3a1a72'); g.addColorStop(1, '#8a2b8f');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    for (const s of bgStars) {
      ctx.globalAlpha = 0.35 + 0.35 * Math.sin(time * 2 + s.tw);
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (const s of stars) {
      const k = s.age / s.life;
      const appear = Math.min(1, s.age * 8);
      const r = s.r * appear * (k > 0.8 ? 1 - (k - 0.8) * 2 : 1);
      if (s.kind === 'cloud') {
        ctx.fillStyle = '#3b3f6e';
        ctx.beginPath();
        ctx.arc(s.x - r * 0.45, s.y + r * 0.1, r * 0.5, 0, Math.PI * 2);
        ctx.arc(s.x, s.y - r * 0.2, r * 0.62, 0, Math.PI * 2);
        ctx.arc(s.x + r * 0.5, s.y + r * 0.1, r * 0.48, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#ffe066';
        ctx.beginPath(); ctx.moveTo(s.x + 2, s.y); ctx.lineTo(s.x - r * 0.15, s.y + r * 0.55); ctx.lineTo(s.x + r * 0.05, s.y + r * 0.5); ctx.lineTo(s.x - 4, s.y + r * 0.95); ctx.lineTo(s.x + r * 0.25, s.y + r * 0.35); ctx.lineTo(s.x + r * 0.05, s.y + r * 0.4); ctx.closePath(); ctx.fill();
      } else {
        const gold = s.kind === 'gold';
        ctx.shadowColor = gold ? '#ffd23f' : `hsl(${s.hue},100%,65%)`; ctx.shadowBlur = gold ? 30 : 20;
        ctx.fillStyle = gold ? '#ffd23f' : `hsl(${s.hue},95%,65%)`;
        starPath(s.x, s.y, r, Math.sin(s.rot) * 0.3); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(255,255,255,.5)';
        starPath(s.x, s.y, r * 0.45, Math.sin(s.rot) * 0.3); ctx.fill();
        // vaqt halqasi
        ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 1.2, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - k)); ctx.stroke();
      }
    }

    for (const p of parts) {
      ctx.globalAlpha = 1 - p.life / p.max;
      ctx.fillStyle = `hsl(${p.hue},100%,70%)`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (const p of pops) { ctx.globalAlpha = 1 - p.life / 0.8; text(p.txt, p.x, p.y - 30, 26, p.color); }
    ctx.globalAlpha = 1;

    const cx = W / 2, cy = H * 0.4;
    if (state === 'play' || state === 'over' || state === 'paused') {
      text(String(score), safe.l + 20, safe.t + 36, 40, '#fff', 'left');
      text(`Rekord ${best}`, safe.l + 22, safe.t + 70, 15, '#d9c8ff', 'left', 700);
      const tl = Math.ceil(timeLeft);
      text(`${tl}s`, W - safe.r - 20, safe.t + 36, 34, tl <= 5 ? '#ff7a9a' : '#ffe066', 'right');
      if (combo >= 5 && state === 'play') text(`Kombo ×${combo}`, W - safe.r - 20, safe.t + 70, 15, '#9fe3ff', 'right', 800);
      // vaqt chizig'i
      ctx.fillStyle = 'rgba(255,255,255,.15)';
      ctx.fillRect(safe.l + 20, safe.t + 88, W - safe.l - safe.r - 40, 5);
      ctx.fillStyle = '#ffe066';
      ctx.fillRect(safe.l + 20, safe.t + 88, (W - safe.l - safe.r - 40) * (timeLeft / ROUND), 5);
    }

    if (state === 'menu') {
      ctx.shadowColor = '#ffd23f'; ctx.shadowBlur = 30; ctx.fillStyle = '#ffd23f';
      starPath(cx, cy - 110, 50 + Math.sin(time * 3) * 4, Math.sin(time) * 0.2); ctx.fill();
      ctx.shadowBlur = 0;
      text('YULDUZ', cx, cy - 20, Math.min(56, W * 0.14), '#fff');
      text('OVCHISI', cx, cy + 34, Math.min(56, W * 0.14), '#ffd23f');
      ctx.globalAlpha = 0.8 + 0.2 * Math.sin(time * 5);
      text('Boshlash uchun teging', cx, cy + 100, 22, '#fff');
      ctx.globalAlpha = 1;
      text('Yulduzlarni yo\'qolmasdan bosing', cx, cy + 138, 15, '#d9c8ff', 'center', 700);
      text('Oltin yulduz +3 · Bulutni bosmang −3', cx, cy + 160, 15, '#d9c8ff', 'center', 700);
      if (best) text(`Rekord: ${best}`, cx, cy + 196, 17, '#ffe066');
    }
    if (state === 'over') {
      text('VAQT TUGADI!', cx, cy - 30, Math.min(44, W * 0.11), '#ff9de2');
      text(`Ochko: ${score}`, cx, cy + 22, 30, '#fff');
      if (score >= best && score > 0) text('Yangi rekord! 🏆', cx, cy + 62, 22, '#ffe066');
      else text(`Rekord: ${best}`, cx, cy + 62, 18, '#d9c8ff', 'center', 700);
      if (performance.now() - overAt > 800) {
        ctx.globalAlpha = 0.8 + 0.2 * Math.sin(time * 5);
        text('Qayta o\'ynash uchun teging', cx, cy + 112, 21, '#9fe3ff');
        ctx.globalAlpha = 1;
      }
    }
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.034, Math.max(0, (now - last) / 1000));
    last = now; update(dt); draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  document.addEventListener('visibilitychange', () => { last = performance.now(); if (document.hidden) pause(); });

  // ---------- iPhone: o'rnatish maslahati ----------
  const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches;
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let hideHint = false;
  try { hideHint = localStorage.getItem('yulduz.hint') === '0'; } catch (e) {}
  hintWanted = isIOS && !standalone && !hideHint;
  if (hintWanted) hintEl().hidden = false;
  document.getElementById('installClose').onclick = () => {
    hintWanted = false;
    hintEl().hidden = true;
    try { localStorage.setItem('yulduz.hint', '0'); } catch (e) {}
  };

  // ---------- Internetsiz ishlash ----------
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
