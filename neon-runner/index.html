<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Neon">
<meta name="theme-color" content="#0d0a1c">
<link rel="apple-touch-icon" href="../icons/neon-180.png">
<link rel="icon" type="image/png" href="../icons/neon-192.png">
<link rel="manifest" href="manifest.webmanifest">

<title>Neon Yuguruvchi</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: radial-gradient(circle at 50% 30%, #23204a, #0b0b1a 70%);
    color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    touch-action: none;
    user-select: none; -webkit-user-select: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
  canvas { display: block; border-radius: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08); }
  #help { font-size: 13px; opacity: .6; text-align: center; padding: 0 16px; line-height: 1.5; }
  #back { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: calc(12px + env(safe-area-inset-left, 0px)); z-index: 5;
    color: #fff; text-decoration: none; font-size: 14px; font-weight: 600; background: rgba(255,255,255,.1); padding: 8px 14px; border-radius: 999px; }
  #rotate { display: none; font-size: 14px; color: #ffe066; text-align: center; }
  @media (orientation: portrait) and (max-width: 700px) { #rotate { display: block; } }
  kbd { background: rgba(255,255,255,.12); border-radius: 4px; padding: 1px 6px; font-family: inherit; }
</style>
</head>
<body>
<a id="back" href="../">← O'yinlar</a>
<div id="wrap">
  <div id="rotate">📱 Telefonni yon tomonga burib o'ynash qulayroq</div>
  <canvas id="c"></canvas>
  <div id="help">
    <kbd>Space</kbd> / <kbd>↑</kbd> — sakrash (havoda yana bir marta bosing — ikki karra sakrash) ·
    <kbd>↓</kbd> — engashish · <kbd>M</kbd> — ovoz<br>
    Telefonda: ekranning o'ng tomoni — sakrash, chap tomoni — engashish
  </div>
</div>
<script>
(() => {
  // ---------- Canvas va o'lchamlar ----------
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const W = 960, H = 400, GROUND = H - 80;
  let scale = 1;

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const helpH = document.getElementById('help').offsetHeight + document.getElementById('rotate').offsetHeight + 24;
    let cw = Math.min(innerWidth - 32, 1100);
    let ch = cw * H / W;
    const maxH = innerHeight - 32 - helpH;
    if (ch > maxH) { ch = maxH; cw = ch * W / H; }
    cv.style.width = cw + 'px';
    cv.style.height = ch + 'px';
    cv.width = Math.round(cw * dpr);
    cv.height = Math.round(ch * dpr);
    scale = cv.width / W;
  }
  addEventListener('resize', resize);
  resize();

  // ---------- Yordamchilar ----------
  const rand = (a, b) => a + Math.random() * (b - a);
  const lerp = (a, b, t) => a + (b - a) * t;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const mix = (c1, c2, t) => `rgb(${Math.round(lerp(c1[0], c2[0], t))},${Math.round(lerp(c1[1], c2[1], t))},${Math.round(lerp(c1[2], c2[2], t))})`;
  const mixArr = (c1, c2, t) => [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)];

  let best = 0;
  try { best = +localStorage.getItem('neonRunnerBest') || 0; } catch (e) {}
  const saveBest = () => { try { localStorage.setItem('neonRunnerBest', best); } catch (e) {} };

  // ---------- Ovoz ----------
  let actx = null, muted = false;
  function sfx(type) {
    if (muted) return;
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      const t = actx.currentTime;
      o.connect(g); g.connect(actx.destination);
      const set = {
        jump:  ['square',   420, 760, 0.12, 0.06],
        jump2: ['square',   620, 1100, 0.12, 0.06],
        coin:  ['triangle', 900, 1500, 0.15, 0.08],
        level: ['sawtooth', 500, 1000, 0.25, 0.05],
        hit:   ['sawtooth', 300, 60, 0.45, 0.12],
      }[type];
      o.type = set[0];
      o.frequency.setValueAtTime(set[1], t);
      o.frequency.exponentialRampToValueAtTime(set[2], t + set[3]);
      g.gain.setValueAtTime(set[4], t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + set[3]);
      o.start(t); o.stop(t + set[3]);
    } catch (e) {}
  }

  // ---------- Fon: kun / tun ranglari ----------
  const PALETTES = [
    { top: [255, 154, 158], bot: [254, 225, 189], m1: [233, 120, 160], m2: [190, 90, 170], gr: [120, 60, 150], sun: [255, 230, 140] }, // tong
    { top: [72, 187, 255],  bot: [190, 240, 255], m1: [110, 130, 255], m2: [80, 90, 220],  gr: [60, 50, 160],  sun: [255, 245, 170] }, // kun
    { top: [255, 110, 90],  bot: [255, 200, 120], m1: [200, 70, 120],  m2: [140, 40, 110], gr: [90, 30, 100],  sun: [255, 170, 90] },  // shom
    { top: [12, 10, 40],    bot: [50, 30, 100],   m1: [60, 40, 130],   m2: [35, 25, 90],   gr: [25, 15, 60],   sun: [230, 230, 255] }, // tun
  ];
  function palette(phase) {
    const n = PALETTES.length;
    const f = (((phase % 1) + 1) % 1) * n, i = Math.floor(f) % n, j = (i + 1) % n;
    let t = f - Math.floor(f);
    t = t < 0.7 ? 0 : (t - 0.7) / 0.3; // ko'p vaqt bir xil rangda, keyin silliq o'tish
    t = t * t * (3 - 2 * t);
    const a = PALETTES[i], b = PALETTES[j], out = {};
    for (const k in a) out[k] = mixArr(a[k], b[k], t);
    out.night = (i === 3 ? 1 - t : 0) + (j === 3 ? t : 0);
    return out;
  }

  // Takrorlanadigan tog' qatlamlari
  function makeLayer(base, amp, seed) {
    const pts = [];
    for (let x = 0; x <= W; x += 16) {
      const a = (x / W) * Math.PI * 2;
      pts.push(base - amp * (0.5 * Math.sin(a * 2 + seed) + 0.3 * Math.sin(a * 5 + seed * 2) + 0.2 * Math.sin(a * 9 + seed * 3)));
    }
    return pts;
  }
  const layer1 = makeLayer(GROUND - 120, 60, 1.3);
  const layer2 = makeLayer(GROUND - 50, 40, 4.1);
  const skyStars = Array.from({ length: 70 }, () => ({ x: rand(0, W), y: rand(0, GROUND - 120), r: rand(0.6, 1.8), tw: rand(0, 6) }));
  const clouds = Array.from({ length: 5 }, () => ({ x: rand(0, W), y: rand(30, 150), s: rand(0.6, 1.3) }));

  // ---------- O'yin holati ----------
  let state = 'menu'; // menu | play | over
  let speed, dist, bonus, coinsGot, score, nextSpawn, obs, coins, parts, trail, shake, overTime, flash, lastLevel, time;
  const P = { x: 120, y: 0, vy: 0, w: 46, h: 46, onGround: true, jumps: 0, duck: false, squash: 0 };

  function reset() {
    speed = 380; dist = 0; bonus = 0; coinsGot = 0; score = 0;
    nextSpawn = 300; obs = []; coins = []; parts = []; trail = [];
    shake = 0; flash = 0; lastLevel = 0; time = 0;
    P.h = 46; P.y = GROUND - P.h; P.vy = 0; P.onGround = true; P.jumps = 0; P.duck = false; P.squash = 0;
  }
  reset();

  function start() {
    if (state === 'over' && performance.now() - overTime < 600) return;
    reset();
    state = 'play';
  }

  // ---------- Zarrachalar ----------
  function burst(x, y, n, hue, spd = 220, size = 4) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2), s = rand(spd * 0.3, spd);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0, max: rand(0.35, 0.8), hue: hue + rand(-30, 30), size: rand(size * 0.5, size) });
    }
  }

  // ---------- Boshqaruv ----------
  function jump() {
    if (state !== 'play') { start(); return; }
    if (P.onGround) {
      P.vy = -920; P.onGround = false; P.jumps = 1; P.squash = -0.6;
      burst(P.x + P.w / 2, GROUND, 10, 190, 160, 4);
      sfx('jump');
    } else if (P.jumps < 2) {
      P.vy = -780; P.jumps = 2;
      burst(P.x + P.w / 2, P.y + P.h, 16, 300, 260, 5);
      sfx('jump2');
    }
  }

  addEventListener('keydown', e => {
    if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); if (!e.repeat) jump(); }
    else if (['ArrowDown', 'KeyS'].includes(e.code)) { e.preventDefault(); P.duck = true; }
    else if (e.code === 'KeyM') muted = !muted;
    else if (e.code === 'Enter' && state !== 'play') start();
  });
  addEventListener('keyup', e => { if (['ArrowDown', 'KeyS'].includes(e.code)) P.duck = false; });

  const duckPointers = new Set();
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (state !== 'play') { start(); return; }
    const r = cv.getBoundingClientRect();
    if (e.clientX - r.left < r.width * 0.4) { duckPointers.add(e.pointerId); P.duck = true; }
    else jump();
  });
  const endPointer = e => { if (duckPointers.delete(e.pointerId) && duckPointers.size === 0) P.duck = false; };
  addEventListener('pointerup', endPointer);
  addEventListener('pointercancel', endPointer);

  // ---------- To'siqlar va yulduzchalar ----------
  function spawn() {
    if (score > 350 && Math.random() < 0.3) {
      const high = Math.random() < 0.55;
      // baland dron: engashib o'tish kerak; past dron: sakrab o'tish kerak
      obs.push({ t: 'drone', x: W + 40, y: high ? GROUND - 68 : GROUND - 34, w: 54, h: 24, ph: rand(0, 6) });
    } else {
      const n = 1 + Math.floor(Math.random() * (score > 200 ? 3 : 2));
      const h = rand(38, 66), w = n * 22 + 6;
      const o = { t: 'crystal', x: W + 40, y: GROUND - h, w, h, n, hue: rand(150, 330) };
      obs.push(o);
      if (Math.random() < 0.45) {
        const cx = o.x + w / 2;
        for (let i = -1; i <= 1; i++) coins.push({ x: cx + i * 42, y: o.y - 50 - (i === 0 ? 30 : 10), r: 11, rot: rand(0, 6) });
      }
    }
    if (Math.random() < 0.25) {
      const sx = W + 260;
      for (let i = 0; i < 4; i++) coins.push({ x: sx + i * 36, y: GROUND - 28, r: 11, rot: rand(0, 6) });
    }
    nextSpawn = speed * rand(0.75, 1.5) + 120;
  }

  const hit = (a, b, pad) => a.x + pad < b.x + b.w && a.x + a.w - pad > b.x && a.y + pad < b.y + b.h && a.y + a.h - pad > b.y;

  function die() {
    state = 'over';
    overTime = performance.now();
    shake = 18;
    burst(P.x + P.w / 2, P.y + P.h / 2, 50, 0, 380, 7);
    sfx('hit');
    if (score > best) { best = score; saveBest(); }
  }

  // ---------- Yangilash ----------
  function update(dt) {
    time += dt;
    shake = Math.max(0, shake - 60 * dt);
    flash = Math.max(0, flash - dt * 2);

    for (const p of parts) { p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 500 * dt; p.vx *= 0.98; }
    parts = parts.filter(p => p.life < p.max);

    const move = state === 'play' ? speed * dt : state === 'menu' ? 160 * dt : 0;
    for (const c of clouds) { c.x -= move * 0.15 * c.s; if (c.x < -150) { c.x = W + 100; c.y = rand(30, 150); } }
    if (state === 'menu') { dist += move; P.y = GROUND - P.h + Math.sin(time * 4) * -4; return; }
    if (state !== 'play') return;

    dist += move;
    speed = Math.min(900, 380 + score * 0.32);
    score = Math.floor(dist / 12) + bonus;

    const level = Math.floor(score / 100);
    if (level > lastLevel) { lastLevel = level; flash = 1; sfx('level'); }

    // O'yinchi fizikasi
    const targetH = P.duck && P.onGround ? 28 : 46;
    if (targetH !== P.h) { P.y += P.h - targetH; P.h = targetH; }
    P.vy += (P.duck && !P.onGround ? 6000 : 2700) * dt;
    P.y += P.vy * dt;
    if (P.y + P.h >= GROUND) {
      if (!P.onGround) { P.squash = 0.7; burst(P.x + P.w / 2, GROUND, 6, 200, 120, 3); }
      P.y = GROUND - P.h; P.vy = 0; P.onGround = true; P.jumps = 0;
    } else P.onGround = false;
    P.squash *= Math.pow(0.0005, dt);

    trail.push({ x: P.x + P.w / 2, y: P.y + P.h / 2, hue: (time * 200) % 360 });
    if (trail.length > 14) trail.shift();
    for (const t of trail) t.x -= move;

    nextSpawn -= move;
    if (nextSpawn <= 0) spawn();

    for (const o of obs) { o.x -= move; if (o.t === 'drone') o.ph += dt * 8; }
    obs = obs.filter(o => o.x + o.w > -50);
    for (const c of coins) { c.x -= move; c.rot += dt * 3; }

    const box = { x: P.x, y: P.y, w: P.w, h: P.h };
    coins = coins.filter(c => {
      if (hit(box, { x: c.x - c.r, y: c.y - c.r, w: c.r * 2, h: c.r * 2 }, -4)) {
        bonus += 25; coinsGot++;
        burst(c.x, c.y, 14, 50, 200, 4);
        sfx('coin');
        return false;
      }
      return c.x > -30;
    });

    for (const o of obs) if (hit(box, o, 7)) { die(); break; }
  }

  // ---------- Chizish ----------
  function drawLayer(pts, offset, color) {
    ctx.fillStyle = color;
    for (let k = 0; k < 2; k++) {
      const ox = -offset + k * W;
      ctx.beginPath();
      ctx.moveTo(ox, GROUND);
      pts.forEach((y, i) => ctx.lineTo(ox + i * 16, y));
      ctx.lineTo(ox + W, GROUND);
      ctx.fill();
    }
  }

  function star(x, y, r, rot) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = rot + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r;
      ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.closePath();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawPlayer() {
    const dead = state === 'over';
    const cx = P.x + P.w / 2, by = P.y + P.h;
    let sx = 1 + 0.25 * P.squash, sy = 1 - 0.25 * P.squash;
    if (!P.onGround) { const st = clamp(-P.vy / 3000, -0.15, 0.2); sx -= st; sy += st; }

    // rangli iz
    if (state === 'play') trail.forEach((t, i) => {
      ctx.globalAlpha = (i / trail.length) * 0.5;
      ctx.fillStyle = `hsl(${t.hue},100%,65%)`;
      ctx.beginPath(); ctx.arc(t.x - 6, t.y, 4 + i * 0.9, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;

    // soya
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    const sh = clamp(1 - (GROUND - by) / 200, 0.3, 1);
    ctx.beginPath(); ctx.ellipse(cx, GROUND + 4, 22 * sh, 5 * sh, 0, 0, Math.PI * 2); ctx.fill();

    ctx.save();
    ctx.translate(cx, by);
    ctx.scale(sx, sy);
    const w = P.w, h = P.h;
    const hue = (time * 60) % 360;
    const g = ctx.createLinearGradient(0, -h, 0, 0);
    g.addColorStop(0, `hsl(${hue},100%,70%)`);
    g.addColorStop(1, `hsl(${(hue + 60) % 360},100%,55%)`);
    ctx.shadowColor = `hsl(${hue},100%,60%)`;
    ctx.shadowBlur = 18;
    ctx.fillStyle = g;
    roundRect(-w / 2, -h, w, h, 16);
    ctx.fill();
    ctx.shadowBlur = 0;

    // antenna
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(4, -h); ctx.quadraticCurveTo(10, -h - 14, 16, -h - 14 + Math.sin(time * 10) * 3); ctx.stroke();
    ctx.fillStyle = '#ffe066';
    ctx.beginPath(); ctx.arc(16, -h - 14 + Math.sin(time * 10) * 3, 4, 0, Math.PI * 2); ctx.fill();

    // ko'zlar
    const ey = -h + (P.duck && P.onGround ? 12 : 18);
    if (dead) {
      ctx.strokeStyle = '#1b1035'; ctx.lineWidth = 3;
      for (const ex of [2, 15]) {
        ctx.beginPath(); ctx.moveTo(ex - 4, ey - 4); ctx.lineTo(ex + 4, ey + 4); ctx.moveTo(ex + 4, ey - 4); ctx.lineTo(ex - 4, ey + 4); ctx.stroke();
      }
    } else {
      const blink = (time % 3.2) < 0.1 ? 0.15 : 1;
      for (const ex of [2, 15]) {
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.ellipse(ex, ey, 6, 7 * blink, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#1b1035';
        ctx.beginPath(); ctx.ellipse(ex + 2, ey + 1, 3, 3.5 * blink, 0, 0, Math.PI * 2); ctx.fill();
      }
      // og'iz
      ctx.strokeStyle = '#1b1035'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(9, ey + 9, 5, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    }
    // yonoq
    ctx.fillStyle = 'rgba(255,90,140,.5)';
    ctx.beginPath(); ctx.arc(-10, ey + 8, 4, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function drawCrystal(o) {
    const sw = o.w / o.n;
    for (let i = 0; i < o.n; i++) {
      const x = o.x + i * sw, hh = o.h * (i % 2 ? 0.78 : 1);
      const hue = (o.hue + i * 25) % 360;
      const g = ctx.createLinearGradient(x, GROUND - hh, x + sw, GROUND);
      g.addColorStop(0, `hsl(${hue},100%,75%)`);
      g.addColorStop(1, `hsl(${(hue + 40) % 360},90%,45%)`);
      ctx.fillStyle = g;
      ctx.shadowColor = `hsl(${hue},100%,60%)`;
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.moveTo(x, GROUND);
      ctx.lineTo(x + sw * 0.15, GROUND - hh * 0.7);
      ctx.lineTo(x + sw / 2, GROUND - hh);
      ctx.lineTo(x + sw * 0.85, GROUND - hh * 0.7);
      ctx.lineTo(x + sw, GROUND);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255,255,255,.35)';
      ctx.beginPath();
      ctx.moveTo(x + sw / 2, GROUND - hh);
      ctx.lineTo(x + sw * 0.15, GROUND - hh * 0.7);
      ctx.lineTo(x + sw * 0.4, GROUND);
      ctx.fill();
    }
  }

  function drawDrone(o) {
    const cx = o.x + o.w / 2, cy = o.y + o.h / 2 + Math.sin(o.ph * 0.5) * 3;
    // parraklar
    ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 2;
    for (const px of [-18, 18]) {
      const l = 14 * Math.abs(Math.cos(o.ph * 3));
      ctx.beginPath(); ctx.moveTo(cx + px - l, cy - 15); ctx.lineTo(cx + px + l, cy - 15); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx + px, cy - 15); ctx.lineTo(cx + px, cy - 6); ctx.stroke();
    }
    const g = ctx.createLinearGradient(0, cy - 12, 0, cy + 12);
    g.addColorStop(0, '#ff7ad9'); g.addColorStop(1, '#7a2cff');
    ctx.fillStyle = g;
    ctx.shadowColor = '#ff4fd8'; ctx.shadowBlur = 16;
    roundRect(o.x, cy - 11, o.w, 22, 11); ctx.fill();
    ctx.shadowBlur = 0;
    const on = Math.sin(o.ph * 2) > 0;
    ctx.fillStyle = on ? '#ff3b3b' : '#7a1020';
    ctx.beginPath(); ctx.arc(o.x + 12, cy, 5, 0, Math.PI * 2); ctx.fill();
    if (on) { ctx.fillStyle = 'rgba(255,60,60,.25)'; ctx.beginPath(); ctx.arc(o.x + 12, cy, 11, 0, Math.PI * 2); ctx.fill(); }
  }

  function text(str, x, y, size, color = '#fff', align = 'center', weight = 800) {
    ctx.font = `${weight} ${size}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
    ctx.textAlign = align;
    ctx.fillStyle = 'rgba(0,0,0,.3)';
    ctx.fillText(str, x + 2, y + 3);
    ctx.fillStyle = color;
    ctx.fillText(str, x, y);
  }

  function draw() {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    if (shake > 0) ctx.translate(rand(-shake, shake) * 0.5, rand(-shake, shake) * 0.5);

    const pal = palette((dist / 12 / 600) % 1);

    // osmon
    const sky = ctx.createLinearGradient(0, 0, 0, GROUND);
    sky.addColorStop(0, mix(pal.top, pal.top, 0));
    sky.addColorStop(1, mix(pal.bot, pal.bot, 0));
    ctx.fillStyle = sky;
    ctx.fillRect(-20, -20, W + 40, H + 40);

    // yulduzlar (tunda)
    if (pal.night > 0.01) {
      for (const s of skyStars) {
        ctx.globalAlpha = pal.night * (0.5 + 0.5 * Math.sin(time * 2 + s.tw));
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }

    // quyosh / oy
    const sunC = mix(pal.sun, pal.sun, 0);
    ctx.shadowColor = sunC; ctx.shadowBlur = 60;
    ctx.fillStyle = sunC;
    ctx.beginPath(); ctx.arc(W - 170, 95, 42, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;

    // bulutlar
    ctx.fillStyle = `rgba(255,255,255,${0.55 - pal.night * 0.4})`;
    for (const c of clouds) {
      ctx.beginPath();
      ctx.arc(c.x, c.y, 22 * c.s, 0, Math.PI * 2);
      ctx.arc(c.x + 25 * c.s, c.y - 10 * c.s, 28 * c.s, 0, Math.PI * 2);
      ctx.arc(c.x + 55 * c.s, c.y, 22 * c.s, 0, Math.PI * 2);
      ctx.fill();
    }

    // tog'lar
    drawLayer(layer1, (dist * 0.15) % W, mix(pal.m1, pal.m1, 0));
    drawLayer(layer2, (dist * 0.4) % W, mix(pal.m2, pal.m2, 0));

    // yer
    const gg = ctx.createLinearGradient(0, GROUND, 0, H);
    gg.addColorStop(0, mix(pal.gr, [255, 255, 255], 0.08));
    gg.addColorStop(1, mix(pal.gr, [0, 0, 0], 0.5));
    ctx.fillStyle = gg;
    ctx.fillRect(-20, GROUND, W + 40, H - GROUND + 20);
    ctx.strokeStyle = `hsl(${(time * 40) % 360},100%,70%)`;
    ctx.lineWidth = 3;
    ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.moveTo(-20, GROUND); ctx.lineTo(W + 20, GROUND); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,.12)';
    const off = dist % 80;
    for (let x = -off; x < W; x += 80) ctx.fillRect(x, GROUND + 22, 40, 4);
    const off2 = (dist * 1.3) % 130;
    for (let x = -off2; x < W; x += 130) ctx.fillRect(x, GROUND + 50, 60, 3);

    // yulduzchalar (tangalar)
    for (const c of coins) {
      const pulse = 1 + Math.sin(c.rot * 2) * 0.08;
      ctx.shadowColor = '#ffd23f'; ctx.shadowBlur = 16;
      ctx.fillStyle = '#ffd23f';
      star(c.x, c.y, c.r * pulse, c.rot); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff6c2';
      star(c.x, c.y, c.r * 0.45 * pulse, c.rot); ctx.fill();
    }

    for (const o of obs) o.t === 'crystal' ? drawCrystal(o) : drawDrone(o);

    drawPlayer();

    // zarrachalar
    for (const p of parts) {
      ctx.globalAlpha = 1 - p.life / p.max;
      ctx.fillStyle = `hsl(${p.hue},100%,65%)`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // daraja chaqnashi
    if (flash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${flash * 0.15})`;
      ctx.fillRect(-20, -20, W + 40, H + 40);
    }

    // HUD
    if (state !== 'menu') {
      text(String(score).padStart(5, '0'), W - 28, 46, 34, flash > 0 ? '#ffe066' : '#fff', 'right');
      text(`REKORD ${String(best).padStart(5, '0')}`, W - 28, 72, 15, 'rgba(255,255,255,.8)', 'right', 700);
      ctx.fillStyle = '#ffd23f'; star(36, 36, 11, -Math.PI / 2); ctx.fill();
      text(`× ${coinsGot}`, 56, 44, 22, '#fff', 'left');
      if (muted) text('🔇', 28, 80, 18, '#fff', 'left');
    }

    if (state === 'menu') {
      ctx.fillStyle = 'rgba(15,10,40,.35)';
      ctx.fillRect(-20, -20, W + 40, H + 40);
      const hue = (time * 80) % 360;
      ctx.shadowColor = `hsl(${hue},100%,60%)`; ctx.shadowBlur = 25;
      text('NEON YUGURUVCHI', W / 2, 140, 60, `hsl(${hue},100%,75%)`);
      ctx.shadowBlur = 0;
      text('To\'siqlardan sakrang, dronlar ostidan engashing, yulduzlarni yig\'ing!', W / 2, 190, 18, '#fff', 'center', 600);
      const a = 0.6 + 0.4 * Math.sin(time * 5);
      ctx.globalAlpha = a;
      text('Boshlash uchun SPACE bosing yoki ekranga teging', W / 2, 240, 22, '#ffe066');
      ctx.globalAlpha = 1;
      if (best) text(`Rekord: ${best}`, W / 2, 275, 16, 'rgba(255,255,255,.85)', 'center', 700);
    }

    if (state === 'over') {
      ctx.fillStyle = 'rgba(15,10,40,.5)';
      ctx.fillRect(-20, -20, W + 40, H + 40);
      text('O\'YIN TUGADI', W / 2, 135, 54, '#ff6b9d');
      text(`Ochko: ${score}   ·   Yulduzlar: ${coinsGot}`, W / 2, 180, 22);
      if (score >= best && score > 0) text('🏆 Yangi rekord!', W / 2, 215, 22, '#ffe066');
      else text(`Rekord: ${best}`, W / 2, 215, 18, 'rgba(255,255,255,.85)', 'center', 700);
      if (performance.now() - overTime > 600) {
        ctx.globalAlpha = 0.6 + 0.4 * Math.sin(time * 5);
        text('Qayta o\'ynash: SPACE yoki ekranga teging', W / 2, 265, 20, '#7ee8fa');
        ctx.globalAlpha = 1;
      }
    }
  }

  // ---------- Asosiy sikl ----------
  let last = performance.now();
  function loop(now) {
    const dt = clamp((now - last) / 1000, 0, 0.033);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
