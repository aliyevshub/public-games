<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rang Jangi">
<meta name="theme-color" content="#0d0a1c">
<link rel="apple-touch-icon" href="../icons/rang-180.png">
<link rel="icon" type="image/png" href="../icons/rang-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Rang Jangi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;600;800&display=swap">
<style>
  /* Layout: bitta vertikal 9:16 "telefon ekrani" markazda, ostida boshqaruv paneli. Dizayn ataylab bitta qorong'i neon uslubda. */
  :root {
    --bg: #0d0a1c;
    --panel: #19142f;
    --line: #2c2550;
    --fg: #f3efff;
    --muted: #a49cc9;
    --accent: #ffd23f;
    --display: "Bungee", "Impact", "Arial Black", sans-serif;
    --body: "Outfit", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; }
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
  body {
    background: radial-gradient(circle at 50% 0%, #241a4a 0%, var(--bg) 60%) var(--bg);
    color: var(--fg);
    font-family: var(--body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 12px;
    box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    overflow: hidden;
  }
  #stage { display: block; border-radius: 22px; box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px var(--line); max-width: 100%; touch-action: manipulation; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 100%; }
  button {
    font: 600 14px/1 var(--body);
    color: var(--fg);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 10px 16px;
    cursor: pointer;
    transition: background .15s, border-color .15s, transform .1s;
  }
  a.btn { font: 600 14px/1 var(--body); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 10px 16px; text-decoration: none; }
  button:hover { border-color: var(--muted); }
  button:active { transform: scale(.96); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); color: #1a1230; border-color: var(--accent); font-weight: 800; }
  .hint { font-size: 12px; color: var(--muted); text-align: center; max-width: 520px; line-height: 1.45; }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<body>
<canvas id="stage" aria-label="Rang jangi simulyatsiyasi: to'rtta rangli shar maydonni bo'yash uchun kurashadi"></canvas>
<div class="bar">
  <a class="btn" href="../">← O'yinlar</a>
  <button id="restart" class="primary" type="button">↻ Qayta boshlash</button>
  <button id="speed" type="button">Tezlik: 1×</button>
  <button id="time" type="button">Vaqt: 60 s</button>
  <button id="sound" type="button">🔇 Ovoz o'chiq</button>
  <button id="auto" type="button">Avto-takror: yoniq</button>
</div>
<div class="hint">Video uchun: ekranni yozib oling (telefonda — ekran yozuvi, kompyuterda — OBS) va Shorts sifatida joylang. Tomoshabinlardan izohda g'olibni taxmin qilishni so'rang.</div>

<script>
(() => {
  const cv = document.getElementById('stage');
  const ctx = cv.getContext('2d');
  const W = 540, H = 960;
  const CELL = 21, COLS = 24, ROWS = 34;
  const AX = (W - COLS * CELL) / 2, AY = 200;
  const AW = COLS * CELL, AH = ROWS * CELL;

  const TEAMS = [
    { name: 'QIZIL',  ball: '#ff4d6d', cell: '#8f1d3c', glow: '#ff2d55' },
    { name: "KO'K",   ball: '#4dc9ff', cell: '#164f8f', glow: '#2aa8ff' },
    { name: 'YASHIL', ball: '#5dff8f', cell: '#1c7a45', glow: '#2dff6e' },
    { name: 'SARIQ',  ball: '#ffd23f', cell: '#93700f', glow: '#ffc400' },
  ];

  // ---------- O'lcham ----------
  let scale = 1;
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const barH = document.querySelector('.bar').offsetHeight + document.querySelector('.hint').offsetHeight + 48;
    let ch = Math.max(320, window.innerHeight - barH);
    let cw = ch * W / H;
    const maxW = Math.min(document.body.clientWidth, window.innerWidth) - 32;
    if (cw > maxW) { cw = maxW; ch = cw * H / W; }
    cv.style.width = cw + 'px';
    cv.style.height = ch + 'px';
    cv.width = Math.round(cw * dpr);
    cv.height = Math.round(ch * dpr);
    scale = cv.width / W;
  }
  addEventListener('resize', resize);

  // ---------- Holat ----------
  const rand = (a, b) => a + Math.random() * (b - a);
  let grid, counts, balls, parts, state, countdown, timeLeft, endTimer, t = 0;
  let speedMul = 1, duration = 60, soundOn = false, autoRepeat = true;

  function reset() {
    grid = new Uint8Array(COLS * ROWS);
    counts = [0, 0, 0, 0];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const team = (c < COLS / 2 ? 0 : 1) + (r < ROWS / 2 ? 0 : 2);
      grid[r * COLS + c] = team;
      counts[team]++;
    }
    balls = TEAMS.map((_, i) => {
      const a = rand(0, Math.PI * 2);
      const sp = 420;
      return {
        t: i,
        x: (i % 2 ? 0.75 : 0.25) * AW,
        y: (i < 2 ? 0.25 : 0.75) * AH,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, sp, r: 9,
        trail: [],
      };
    });
    parts = [];
    state = 'count';
    countdown = 3.99;
    timeLeft = duration;
    endTimer = 0;
  }

  // ---------- Ovoz ----------
  let actx = null, lastBeep = 0;
  function beep(freq, len = 0.06, vol = 0.03, type = 'triangle') {
    if (!soundOn || !actx) return;
    const now = actx.currentTime;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, now);
    g.gain.exponentialRampToValueAtTime(0.0001, now + len);
    o.connect(g); g.connect(actx.destination);
    o.start(now); o.stop(now + len);
  }

  // ---------- Fizika ----------
  const ANGLES = Array.from({ length: 8 }, (_, i) => i * Math.PI / 4);

  function stepBall(b, dt) {
    b.x += b.vx * dt;
    b.y += b.vy * dt;

    // devorlar
    if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx); }
    if (b.x > AW - b.r) { b.x = AW - b.r; b.vx = -Math.abs(b.vx); }
    if (b.y < b.r) { b.y = b.r; b.vy = Math.abs(b.vy); }
    if (b.y > AH - b.r) { b.y = AH - b.r; b.vy = -Math.abs(b.vy); }

    // begona kataklar: bo'yash va qaytish
    let bounced = false;
    for (const a of ANGLES) {
      const cx = Math.cos(a), sy = Math.sin(a);
      const px = b.x + cx * b.r, py = b.y + sy * b.r;
      const c = Math.floor(px / CELL), r = Math.floor(py / CELL);
      if (c < 0 || c >= COLS || r < 0 || r >= ROWS) continue;
      const k = r * COLS + c;
      const owner = grid[k];
      if (owner !== b.t) {
        counts[owner]--; counts[b.t]++;
        grid[k] = b.t;
        burst(AX + (c + 0.5) * CELL, AY + (r + 0.5) * CELL, TEAMS[b.t].ball);
        if (!bounced) {
          if (Math.abs(cx) > Math.abs(sy)) b.vx = cx > 0 ? -Math.abs(b.vx) : Math.abs(b.vx);
          else b.vy = sy > 0 ? -Math.abs(b.vy) : Math.abs(b.vy);
          bounced = true;
        }
        if (actx && soundOn && actx.currentTime - lastBeep > 0.035) {
          lastBeep = actx.currentTime;
          beep(320 + b.t * 110 + Math.random() * 40);
        }
      }
    }
    if (bounced) {
      // kichik tasodifiy burilish — shar bir joyda aylanib qolmasin
      const ang = Math.atan2(b.vy, b.vx) + rand(-0.12, 0.12);
      b.vx = Math.cos(ang) * b.sp; b.vy = Math.sin(ang) * b.sp;
      if (Math.abs(b.vx) < b.sp * 0.25) b.vx = Math.sign(b.vx || 1) * b.sp * 0.25;
      if (Math.abs(b.vy) < b.sp * 0.25) b.vy = Math.sign(b.vy || 1) * b.sp * 0.25;
    }
  }

  function burst(x, y, color) {
    if (parts.length > 400) return;
    for (let i = 0; i < 3; i++) {
      const a = rand(0, Math.PI * 2), s = rand(40, 140);
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0, max: rand(0.25, 0.5), color });
    }
  }

  function leader() {
    let best = 0;
    for (let i = 1; i < 4; i++) if (counts[i] > counts[best]) best = i;
    return best;
  }

  function update(dt) {
    t += dt;
    for (const p of parts) { p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.95; p.vy *= 0.95; }
    parts = parts.filter(p => p.life < p.max);

    if (state === 'count') {
      const before = Math.ceil(countdown);
      countdown -= dt;
      if (Math.ceil(countdown) !== before && countdown > 0) beep(600, 0.12, 0.05, 'square');
      if (countdown <= 0) { state = 'play'; beep(1000, 0.25, 0.05, 'square'); }
      return;
    }
    if (state === 'play') {
      const sdt = dt * speedMul;
      timeLeft -= sdt;
      const steps = Math.ceil(sdt * 420 / 3);
      for (let s = 0; s < steps; s++) for (const b of balls) stepBall(b, sdt / steps);
      for (const b of balls) {
        b.trail.push({ x: b.x, y: b.y });
        if (b.trail.length > 10) b.trail.shift();
      }
      if (timeLeft <= 0) {
        timeLeft = 0; state = 'end'; endTimer = 0;
        [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.25, 0.05, 'square'), i * 120));
      }
      return;
    }
    if (state === 'end') {
      endTimer += dt;
      if (autoRepeat && endTimer > 7) reset();
    }
  }

  // ---------- Chizish ----------
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function txt(s, x, y, size, color, font = 'display', align = 'center', shadow = true) {
    ctx.font = font === 'display' ? `${size}px Bungee, Impact, "Arial Black", sans-serif` : `800 ${size}px Outfit, system-ui, sans-serif`;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    if (shadow) { ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillText(s, x + 2, y + 3); }
    ctx.fillStyle = color;
    ctx.fillText(s, x, y);
  }

  function draw() {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);

    // fon
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#1d1540');
    bg.addColorStop(1, '#0a0716');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // sarlavha
    const hue = (t * 60) % 360;
    ctx.shadowColor = `hsl(${hue},100%,60%)`; ctx.shadowBlur = 20;
    txt('QAYSI RANG', W / 2, 46, 40, '#ffffff');
    txt('YUTADI?', W / 2, 92, 46, `hsl(${hue},100%,72%)`);
    ctx.shadowBlur = 0;

    // foiz chizig'i
    const total = COLS * ROWS, by = 132, bh = 26, bx = AX, bw = AW;
    rr(bx, by, bw, bh, 13); ctx.save(); ctx.clip();
    let x = bx;
    counts.forEach((n, i) => {
      const w = bw * n / total;
      ctx.fillStyle = TEAMS[i].ball;
      ctx.fillRect(x, by, w + 0.5, bh);
      if (w > 44) txt(Math.round(n / total * 100) + '%', x + w / 2, by + bh / 2 + 1, 15, '#140c26', 'body', 'center', false);
      x += w;
    });
    ctx.restore();

    // taymer va yetakchi
    const lead = leader();
    txt(state === 'count' ? `${duration}s` : `${Math.ceil(timeLeft)}s`, bx, 180, 18, '#ffffff', 'body', 'left');
    txt(`👑 ${TEAMS[lead].name}`, bx + bw, 180, 18, TEAMS[lead].ball, 'body', 'right');

    // maydon
    ctx.save();
    ctx.translate(AX, AY);
    rr(0, 0, AW, AH, 14); ctx.save(); ctx.clip();
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const team = grid[r * COLS + c];
      ctx.fillStyle = TEAMS[team].cell;
      ctx.fillRect(c * CELL, r * CELL, CELL, CELL);
    }
    // nozik katak chiziqlari
    ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let c = 1; c < COLS; c++) { ctx.moveTo(c * CELL + 0.5, 0); ctx.lineTo(c * CELL + 0.5, AH); }
    for (let r = 1; r < ROWS; r++) { ctx.moveTo(0, r * CELL + 0.5); ctx.lineTo(AW, r * CELL + 0.5); }
    ctx.stroke();

    // sharlar
    for (const b of balls) {
      const tm = TEAMS[b.t];
      b.trail.forEach((p, i) => {
        ctx.globalAlpha = (i / b.trail.length) * 0.35;
        ctx.fillStyle = tm.ball;
        ctx.beginPath(); ctx.arc(p.x, p.y, b.r * (0.4 + 0.6 * i / b.trail.length), 0, Math.PI * 2); ctx.fill();
      });
      ctx.globalAlpha = 1;
      ctx.shadowColor = tm.glow; ctx.shadowBlur = 18;
      ctx.fillStyle = tm.ball;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.5;
      ctx.stroke();
    }
    ctx.restore();
    ctx.strokeStyle = 'rgba(255,255,255,.15)'; ctx.lineWidth = 2;
    rr(0, 0, AW, AH, 14); ctx.stroke();
    ctx.restore();

    // zarrachalar
    for (const p of parts) {
      ctx.globalAlpha = 1 - p.life / p.max;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;

    // pastki yozuv
    txt('Izohda yozing: siz qaysi rangni tanladingiz?', W / 2, AY + AH + 34, 17, '#cfc6ff', 'body');

    // teskari sanoq
    if (state === 'count') {
      ctx.fillStyle = 'rgba(10,7,22,.45)';
      ctx.fillRect(AX, AY, AW, AH);
      const n = Math.ceil(countdown);
      const k = countdown - Math.floor(countdown);
      ctx.save();
      ctx.translate(W / 2, AY + AH / 2);
      const s = 1 + (1 - k) * 0.4;
      ctx.scale(s, s);
      ctx.globalAlpha = Math.min(1, k * 2);
      txt(n > 3 ? 'TANLANG!' : String(n), 0, 0, n > 3 ? 56 : 140, n > 3 ? '#ffffff' : TEAMS[(3 - n + 4) % 4].ball);
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    // g'olib
    if (state === 'end') {
      const w = TEAMS[lead];
      const a = Math.min(1, endTimer * 3);
      ctx.globalAlpha = a;
      ctx.fillStyle = 'rgba(10,7,22,.72)';
      ctx.fillRect(0, 0, W, H);
      const cy = H / 2 - 40;
      ctx.save();
      ctx.translate(W / 2, cy);
      const pop = 1 + Math.max(0, 0.3 - endTimer) * 1.5;
      ctx.scale(pop, pop);
      txt('G\'OLIB', 0, -110, 34, '#ffffff');
      ctx.shadowColor = w.glow; ctx.shadowBlur = 40;
      txt(w.name, 0, -40, 84, w.ball);
      ctx.shadowBlur = 0;
      txt(Math.round(counts[lead] / (COLS * ROWS) * 100) + '% hudud', 0, 30, 30, '#ffffff', 'body');
      ctx.restore();
      // natijalar ro'yxati
      const order = [0, 1, 2, 3].sort((p, q) => counts[q] - counts[p]);
      order.forEach((i, idx) => {
        const y = cy + 70 + idx * 40;
        ctx.fillStyle = TEAMS[i].ball;
        ctx.beginPath(); ctx.arc(W / 2 - 110, y, 11, 0, Math.PI * 2); ctx.fill();
        txt(`${idx + 1}. ${TEAMS[i].name}`, W / 2 - 88, y + 1, 22, '#ffffff', 'body', 'left');
        txt(Math.round(counts[i] / (COLS * ROWS) * 100) + '%', W / 2 + 130, y + 1, 22, TEAMS[i].ball, 'body', 'right');
      });
      txt('Obuna bo\'ling va like bosing! 👍', W / 2, cy + 260, 22, '#ffd23f', 'body');
      ctx.globalAlpha = 1;
      // konfetti
      if (Math.random() < 0.6) parts.push({ x: rand(0, W), y: -10, vx: rand(-30, 30), vy: rand(120, 260), life: 0, max: 4, color: [w.ball, '#ffffff', '#ffd23f'][Math.floor(rand(0, 3))] });
    }
  }

  // ---------- Sikl ----------
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(loop);
  }

  // ---------- Tugmalar ----------
  const $ = id => document.getElementById(id);
  $('restart').onclick = () => reset();
  $('speed').onclick = () => {
    speedMul = speedMul === 1 ? 2 : speedMul === 2 ? 3 : 1;
    $('speed').textContent = `Tezlik: ${speedMul}×`;
  };
  $('time').onclick = () => {
    duration = duration === 30 ? 60 : duration === 60 ? 90 : 30;
    $('time').textContent = `Vaqt: ${duration} s`;
    reset();
  };
  $('sound').onclick = () => {
    soundOn = !soundOn;
    if (soundOn && !actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { soundOn = false; } }
    if (actx && actx.state === 'suspended') actx.resume();
    $('sound').textContent = soundOn ? '🔊 Ovoz yoniq' : '🔇 Ovoz o\'chiq';
  };
  $('auto').onclick = () => {
    autoRepeat = !autoRepeat;
    $('auto').textContent = `Avto-takror: ${autoRepeat ? 'yoniq' : "o'chiq"}`;
  };
  addEventListener('keydown', e => { if (e.code === 'KeyR') reset(); });

  reset();
  resize();
  requestAnimationFrame(loop);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(resize);
})();
</script>
</body>
</html>
